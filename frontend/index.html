<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('cr-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call-Centre Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --sidebar-bg:#eef0fb; --panel:#ffffff; --panel-2:#f4f5fb; --border:#e3e6f0;
    --ink:#12172b; --body:#2b3350; --muted:#6b7280; --dim:#98a1b3;
    --agent:#2563a8; --caller:#a8720a;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-ink:#ffffff;
    --accent-soft-bg:#e9e8fb; --accent-soft-fg:#4338ca;
    --crit:#dc2626;    --crit-soft-bg:#fde3e3; --crit-soft-fg:#b91c1c;
    --hot:#c2410c;     --hot-soft-bg:#ffedd5;  --hot-soft-fg:#9a3412;
    --warn:#0d9488;    --warn-soft-bg:#ccfbf1; --warn-soft-fg:#0f766e;
    --ok:#4f46e5;      --ok-soft-bg:#e9e8fb;   --ok-soft-fg:#4338ca;
    --shadow:0 12px 32px rgba(30,35,70,.10);
    --shadow-sm:0 2px 8px rgba(30,35,70,.06);
    --radius:12px;
    --av-bg-l:88%; --av-fg-l:34%;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --sidebar-w:264px;
  }
  :root[data-theme="dark"]{
    --bg:#0f1220; --sidebar-bg:#161a2c; --panel:#1b2036; --panel-2:#222842; --border:#2b3150;
    --ink:#eef0fa; --body:#cdd3e6; --muted:#9aa3c0; --dim:#6b7396;
    --agent:#6fb1e8; --caller:#e8b04b;
    --accent:#8b85f5; --accent-hover:#a29cf7; --accent-ink:#0f1220;
    --accent-soft-bg:#292763; --accent-soft-fg:#c7c2fb;
    --crit:#f0555a;    --crit-soft-bg:rgba(240,85,90,.16);  --crit-soft-fg:#ff9d9f;
    --hot:#f0824a;     --hot-soft-bg:rgba(240,130,74,.16);  --hot-soft-fg:#ffb27e;
    --warn:#2fc4b4;    --warn-soft-bg:rgba(47,196,180,.16); --warn-soft-fg:#7de8db;
    --ok:#8b85f5;      --ok-soft-bg:rgba(139,133,245,.18);  --ok-soft-fg:#c7c2fb;
    --shadow:0 12px 32px rgba(0,0,0,.40);
    --shadow-sm:0 2px 10px rgba(0,0,0,.32);
    --av-bg-l:24%; --av-fg-l:80%;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  html[data-theme="dark"]{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit}
  h1,h2,h3{font-family:var(--sans);color:var(--ink)}
  ::selection{background:var(--accent);color:#fff}

  .app{display:flex;min-height:100vh}
  /* ---- sidebar ---- */
  .sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);
           width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;
           overflow:hidden;transition:width .2s ease,flex-basis .2s ease,opacity .16s ease}
  .app.collapsed .sidebar{width:0;flex-basis:0;opacity:0;border-right:none}
  .sidebar-inner{width:var(--sidebar-w);display:flex;flex-direction:column;height:100%;padding:20px 16px}
  .logo-block{display:flex;align-items:center;gap:11px;padding:4px 6px 22px}
  .logo-icon{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;
             display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 38px}
  .logo-name{font-weight:800;font-size:17px;color:var(--accent);letter-spacing:-.01em}
  .logo-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
            color:var(--muted);line-height:1.35;margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;color:var(--body);
              font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:11px;
              transition:background .12s,color .12s}
  .nav button svg{width:17px;height:17px;flex:0 0 17px;color:var(--muted)}
  .nav button:hover{background:var(--panel)}
  .nav button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm)}
  .nav button.on svg{color:var(--accent)}
  .sidebar-spacer{flex:1}
  .user-card{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;
             background:var(--panel);border:1px solid var(--border)}
  .user-info{display:flex;flex-direction:column;gap:1px;min-width:0}
  .user-name{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-role{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .dot-online{width:6px;height:6px;border-radius:50%;background:var(--warn);display:inline-block}

  /* ---- content column ---- */
  .content-col{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
          display:flex;align-items:center;gap:12px;padding:14px 26px}
  .icon-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:9px;color:var(--muted);
            display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;flex:0 0 36px}
  .icon-btn:hover{background:var(--panel-2);color:var(--ink)}
  .icon-btn svg{width:17px;height:17px}
  .search-box{flex:1;max-width:640px;display:flex;align-items:center;gap:9px;background:var(--panel);
              border:1px solid var(--border);border-radius:10px;padding:9px 13px;transition:border-color .15s}
  .search-box:focus-within{border-color:var(--accent)}
  .search-box svg{width:15px;height:15px;color:var(--dim);flex:0 0 15px}
  .search-box input{all:unset;flex:1;font-size:13px;color:var(--ink)}
  .search-box input::placeholder{color:var(--dim)}
  .kbd{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--border);
       border-radius:5px;padding:2px 6px;background:var(--panel-2)}
  .profile-menu{position:relative}
  .profile-trigger{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;
                   border-radius:10px;font-size:13px;color:var(--body);transition:background .12s}
  .profile-trigger:hover{background:var(--panel-2)}
  .profile-trigger svg{width:13px;height:13px;color:var(--dim)}
  .profile-dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);
                    border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);
                    width:200px;padding:8px;display:none;z-index:30}
  .profile-dropdown.open{display:block}
  .pd-row{padding:8px 10px;font-size:13px}
  .pd-row .dim{color:var(--muted);font-size:11.5px}
  .pd-sep{height:1px;background:var(--border);margin:6px 2px}
  .pd-item{all:unset;cursor:pointer;display:block;width:100%;padding:8px 10px;border-radius:7px;
           font-size:12.5px;color:var(--body)}
  .pd-item:hover{background:var(--panel-2)}
  .pd-item[disabled]{color:var(--dim);cursor:default}
  .pd-item[disabled]:hover{background:none}

  .main{flex:1;min-width:0;padding:26px 30px 70px;opacity:1;transition:opacity .15s ease}
  .main.enter{opacity:0}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .page-head h2{margin:0 0 6px;font-size:25px;font-weight:800;letter-spacing:-.015em}
  .page-head .note{color:var(--muted);font-size:13px}
  .btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--body);display:inline-flex;
       align-items:center;gap:7px;border:1px solid var(--border);padding:9px 15px;border-radius:9px;
       background:var(--panel);transition:border-color .15s,box-shadow .15s}
  .btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft-bg)}
  .btn svg{width:14px;height:14px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:none}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat-card{background:var(--accent-soft-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .stat-card .label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
                     color:var(--muted);margin-bottom:8px}
  .stat-card .value{font-size:25px;font-weight:800;color:var(--ink);font-family:var(--mono)}
  .stat-card .value.tone-warn{color:var(--hot)}
  .stat-card .status-row{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--warn)}
  .stat-card .status-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}

  /* generic card + table */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
        padding:18px 20px;margin-bottom:16px}
  .card h4{margin:0 0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
           display:flex;align-items:center;gap:6px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:14px 14px;font-size:13.5px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{font-family:var(--mono);color:var(--muted);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
     font-weight:600;background:var(--panel-2)}
  th:first-child{border-top-left-radius:var(--radius)} th:last-child{border-top-right-radius:var(--radius)}
  tbody tr{transition:background .12s;cursor:pointer}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:none}
  .table-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}

  /* score squares + soft pills */
  .score{font-family:var(--mono);font-weight:700;font-size:13px;color:#fff;border-radius:8px;
         padding:6px 0;min-width:38px;text-align:center;display:inline-block}
  .score.sev-crit{background:var(--crit)} .score.sev-hot{background:var(--hot)}
  .score.sev-warn{background:var(--warn)} .score.sev-ok{background:var(--ok)}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
        padding:4px 10px;border-radius:20px;display:inline-block}
  .pill.sev-crit{background:var(--crit-soft-bg);color:var(--crit-soft-fg)}
  .pill.sev-hot{background:var(--hot-soft-bg);color:var(--hot-soft-fg)}
  .pill.sev-warn{background:var(--warn-soft-bg);color:var(--warn-soft-fg)}
  .pill.sev-ok{background:var(--ok-soft-bg);color:var(--ok-soft-fg)}
  .pill.solid{color:#fff}
  .pill.solid.sev-crit{background:var(--crit)} .pill.solid.sev-hot{background:var(--hot)}
  .pill.solid.sev-warn{background:var(--warn)} .pill.solid.sev-ok{background:var(--ok)}
  .mood-text{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .mood-text.m-positive{color:var(--warn-soft-fg)} .mood-text.m-calm{color:var(--muted)}
  .mood-text.m-concerned{color:var(--hot-soft-fg)} .mood-text.m-frustrated{color:var(--crit-soft-fg)}

  /* evidence chip inline in tables */
  .ev-inline{display:inline-flex;align-items:flex-start;gap:9px;background:var(--panel-2);border:1px solid var(--border);
             border-radius:8px;padding:8px 11px;margin-top:8px;max-width:480px;cursor:pointer;transition:border-color .12s}
  .ev-inline:hover{border-color:var(--accent)}
  .ev-inline .t{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent);
                background:var(--accent-soft-bg);border-radius:5px;padding:3px 6px;flex:0 0 auto}
  .ev-inline .q{font-size:12px;font-style:italic;color:var(--body)}

  .progress{display:flex;align-items:center;gap:9px}
  .progress .track{width:96px;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden}
  .progress .track>span{display:block;height:100%;border-radius:4px}
  .progress .track>span.sev-crit{background:var(--crit)} .progress .track>span.sev-hot{background:var(--hot)}
  .progress .track>span.sev-warn{background:var(--warn)} .progress .track>span.sev-ok{background:var(--ok)}
  .progress .num{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink);min-width:20px}

  .name-cell{display:flex;align-items:center;gap:11px}
  .name-cell .meta{display:flex;flex-direction:column;gap:1px;min-width:0}
  .name-cell .nm{font-weight:600;color:var(--ink);font-size:13.5px}
  .name-cell .id{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          font-size:11.5px;font-weight:700;flex:0 0 34px}
  .av-0{background:hsl(210 70% var(--av-bg-l));color:hsl(210 70% var(--av-fg-l))}
  .av-1{background:hsl(280 55% var(--av-bg-l));color:hsl(280 55% var(--av-fg-l))}
  .av-2{background:hsl(340 65% var(--av-bg-l));color:hsl(340 65% var(--av-fg-l))}
  .av-3{background:hsl(24 75% var(--av-bg-l));color:hsl(24 75% var(--av-fg-l))}
  .av-4{background:hsl(48 75% var(--av-bg-l));color:hsl(48 75% var(--av-fg-l))}
  .av-5{background:hsl(165 55% var(--av-bg-l));color:hsl(165 55% var(--av-fg-l))}
  .av-6{background:hsl(100 40% var(--av-bg-l));color:hsl(100 40% var(--av-fg-l))}
  .av-7{background:hsl(255 55% var(--av-bg-l));color:hsl(255 55% var(--av-fg-l))}

  .action-btn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;color:var(--muted);
              display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .action-btn:hover{background:var(--accent-soft-bg);color:var(--accent)}
  .action-btn svg{width:15px;height:15px}

  /* insight banner (Trends) */
  .insight{display:flex;align-items:center;gap:16px;background:var(--crit-soft-bg);border:1px solid var(--crit-soft-fg);
           border-radius:var(--radius);padding:16px 20px;margin-bottom:22px}
  .insight-icon{width:38px;height:38px;border-radius:9px;background:var(--panel);display:flex;align-items:center;
                justify-content:center;color:var(--crit);flex:0 0 38px}
  .insight-icon svg{width:19px;height:19px}
  .insight-body{flex:1;min-width:0}
  .insight-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
                 color:var(--crit-soft-fg);font-weight:700;margin-bottom:3px}
  .insight-title{font-size:17px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px}
  .insight-delta{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--crit);
                 background:var(--panel);border-radius:20px;padding:3px 10px}

  .charts-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:900px){.charts-row{grid-template-columns:1fr}}
  .chart-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
  .chart-foot .big{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--ink)}
  .chart-foot .delta{font-family:var(--mono);font-size:12px;color:var(--warn-soft-fg);font-weight:700}

  .res-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:900px){.res-tiles{grid-template-columns:repeat(2,1fr)}}
  .res-tile{border-radius:11px;padding:15px 17px;border:1px solid var(--border)}
  .res-tile .cat{font-size:13px;color:var(--muted);margin-bottom:6px}
  .res-tile .pct{font-family:var(--mono);font-size:21px;font-weight:800;color:var(--ink)}
  .res-tile .status{float:right;font-size:11.5px;font-weight:700;margin-top:10px}

  /* bulk upload */
  .dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:52px 20px;text-align:center;
            background:var(--panel-2);transition:border-color .15s,background .15s;cursor:pointer}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft-bg)}
  .dropzone .cloud{color:var(--dim);margin-bottom:14px}
  .dropzone .cloud svg{width:38px;height:38px}
  .dropzone .title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .dropzone .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .queue-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
  .queue-head h4{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .queue-count{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .queue-head-right{display:flex;align-items:baseline;gap:14px}
  .qi-clear{all:unset;cursor:pointer;width:26px;height:26px;flex:0 0 26px;border-radius:7px;
            display:flex;align-items:center;justify-content:center;color:var(--dim);
            margin-left:4px;transition:background .12s,color .12s}
  .qi-clear svg{width:14px;height:14px}
  .qi-clear:hover{background:var(--crit-soft-bg);color:var(--crit-soft-fg)}
  .qi-clear:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .q-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .q-item-top{display:flex;align-items:center;gap:11px}
  .q-item .qi-icon{width:30px;height:30px;border-radius:8px;background:var(--panel-2);display:flex;
                    align-items:center;justify-content:center;color:var(--muted);flex:0 0 30px}
  .q-item .qi-icon svg{width:15px;height:15px}
  .q-item .qi-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-item .qi-status{font-family:var(--mono);font-size:11.5px;font-weight:700;flex:0 0 auto}
  .q-item .qi-status.processing{color:var(--muted)}
  .q-item .qi-status.ok{color:var(--warn-soft-fg)}
  .q-item .qi-status.err{color:var(--crit-soft-fg)}
  .q-item .qi-bar{height:4px;border-radius:3px;background:var(--panel-2);margin-top:9px;overflow:hidden}
  .q-item .qi-bar>span{display:block;height:100%;background:var(--accent);border-radius:3px;animation:indet 1.1s ease-in-out infinite}
  @keyframes indet{0%{width:15%;margin-left:0%}50%{width:55%;margin-left:45%}100%{width:15%;margin-left:85%}}
  .q-sub{margin-top:10px;padding-left:41px;display:flex;flex-direction:column;gap:6px}
  .q-sub-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .q-sub-row svg{width:13px;height:13px;flex:0 0 13px}
  .q-sub-row.ok{color:var(--warn-soft-fg)} .q-sub-row.err{color:var(--crit-soft-fg)}
  .q-sub-row a{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}

  /* call detail (reused structure, new tokens) */
  .grid2{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:980px){.grid2{grid-template-columns:1fr}}
  audio{width:100%;margin-top:4px}
  .summary-text{font-size:15px;line-height:1.6;color:var(--ink)}
  .turn{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--border);transition:background .15s}
  .turn:first-child{border-top:none}
  .ts{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--dim);
      min-width:46px;padding-top:2px;border-radius:4px}
  .ts:hover{color:var(--accent)}
  .turn .body{flex:1}
  .spk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .spk.agent{color:var(--agent)} .spk.caller{color:var(--caller)}
  .turn.hl{background:var(--accent-soft-bg);border-radius:6px;margin:0 -8px;padding:8px}
  .mood-row{display:flex;align-items:center;gap:0;margin-top:6px}
  .track-line{flex:1;height:3px;background:linear-gradient(90deg,var(--warn),var(--crit));
              margin:0 10px;position:relative;border-radius:2px}
  .marker{position:absolute;top:-4.5px;width:11px;height:11px;border-radius:50%;
          background:var(--hot);border:2px solid var(--panel);cursor:pointer}
  .ev{background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--accent);
      border-radius:6px;padding:9px 11px;margin-top:8px;cursor:pointer;transition:border-color .12s}
  .ev:hover{border-left-color:var(--caller)}
  .ev .q{font-size:12.5px;color:var(--ink);font-style:italic}
  .ev .at{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-top:3px}
  .note-line{color:var(--muted);font-size:12.5px}
  .reasons{list-style:none;margin:0;padding:0}
  .reasons li{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;
              border-top:1px solid var(--border);color:var(--muted)}
  .reasons li:first-child{border-top:none}
  .reasons b{font-family:var(--mono);color:var(--ink);font-weight:700}
  .back{all:unset;cursor:pointer;color:var(--accent);font-size:12.5px;margin-bottom:14px;display:inline-flex;
        align-items:center;gap:6px;font-weight:600}
  .back svg{width:13px;height:13px}

  /* ---- settings: section labels + cards ---- */
  .sec-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
             color:var(--muted);font-weight:600;margin:26px 0 10px}
  .sec-label:first-child{margin-top:4px}
  .set-card{padding:16px 18px}

  /* hardware facts strip */
  .hw-strip{display:flex;align-items:center;flex-wrap:wrap;gap:0;background:var(--panel-2);
            border:1px solid var(--border);border-radius:8px;padding:9px 13px;
            font-family:var(--mono);font-size:11px;color:var(--muted)}
  .hw-strip b{color:var(--ink);font-weight:700;margin-right:9px;text-transform:uppercase;
              letter-spacing:.04em}
  .hw-strip span{color:var(--muted)}
  .hw-sep{display:inline-block;width:1px;height:12px;background:var(--border);margin:0 13px}

  /* recommendation + in-use strips */
  .rec-strip,.inuse-strip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
        background:var(--accent-soft-bg);border:1px solid var(--accent-soft-bg);
        border-radius:8px;padding:10px 13px;margin-top:10px;font-size:13px;color:var(--ink)}
  .rec-strip svg{width:15px;height:15px;color:var(--accent);flex:0 0 15px}
  .rec-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
           font-weight:700;background:var(--accent);color:#fff;border-radius:4px;padding:3px 7px}
  .rec-body{flex:1;min-width:200px;color:var(--body);font-size:12.5px}
  .rec-body b{color:var(--ink)}
  .inuse-strip b{font-size:13.5px}

  /* warnings */
  .warn-strip{background:var(--crit-soft-bg);border:1px solid var(--crit-soft-bg);
              border-radius:8px;padding:10px 13px;margin-top:8px;
              display:flex;flex-direction:column;gap:7px}
  .warn-row{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
            color:var(--crit-soft-fg);line-height:1.5}
  .warn-row svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px}

  /* option rows (shared by whisper + llm) */
  .opt-list{display:flex;flex-direction:column;gap:2px;margin-top:12px}
  .opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
       padding:12px 13px;border:1px solid transparent;border-radius:9px;cursor:pointer;
       transition:background .12s,border-color .12s}
  .opt:hover{background:var(--panel-2)}
  .opt.on{background:var(--accent-soft-bg);border-color:var(--accent)}
  .opt.disabled{opacity:.5;cursor:not-allowed}
  .opt input{accent-color:var(--accent);width:15px;height:15px;margin-top:2px;cursor:pointer}
  .opt.auto{margin-top:12px}
  .opt-title{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;
             align-items:center;gap:8px;flex-wrap:wrap}
  .opt-sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:400}
  .opt-note{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;max-width:62ch}
  .opt-note b{color:var(--ink)}
  .opt-right{text-align:right;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .opt-mono{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px}
  .tagpill{font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
           font-weight:700;border-radius:4px;padding:3px 7px;display:inline-flex;
           align-items:center;gap:4px}
  .tagpill svg{width:10px;height:10px}
  .tagpill.rec{background:var(--accent);color:#fff}
  .tagpill.use{background:var(--accent-soft-bg);color:var(--accent-soft-fg);
               border:1px solid var(--accent)}
  .tagpill.key{background:var(--warn-soft-bg);color:var(--warn-soft-fg)}
  .tagpill.nokey{background:var(--panel-3);color:var(--dim)}
  .loaded-line{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:12px;
               padding-top:10px;border-top:1px solid var(--border)}

  /* provider groups */
  .prov-grp{margin-top:16px}
  .prov-grp.off{opacity:.6}
  .prov-head{display:flex;align-items:center;gap:9px;padding:0 2px 6px}
  .prov-name{font-size:13px;font-weight:650;color:var(--ink)}
  .prov-hint{font-size:11.5px;color:var(--muted);padding:0 2px 6px}
  .prov-hint code{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);
                  border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--ink)}

  /* upload page summary line */
  .upload-model{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px;
                flex-wrap:wrap;padding:2px 4px 14px}
  .upload-model b{color:var(--ink);font-weight:600}
  .link-btn{all:unset;cursor:pointer;color:var(--accent);font-size:12.5px;text-decoration:underline}
  .link-btn:hover{color:var(--accent-hover)}
  .qi-model{font-family:var(--mono);font-size:10px;background:var(--accent-soft-bg);
            color:var(--accent-soft-fg);border-radius:20px;padding:2px 8px;margin-left:8px;
            font-weight:600}

  /* summary cell + tooltip */
  .sum-cell{max-width:330px}
  .sum-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
             overflow:hidden;cursor:help;border-radius:4px}
  .sum-clamp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tooltip{position:fixed;z-index:400;max-width:430px;background:var(--ink);color:var(--panel);
           font-size:12.5px;line-height:1.5;padding:10px 13px;border-radius:8px;
           box-shadow:var(--shadow);pointer-events:none;opacity:0;visibility:hidden;
           transition:opacity .13s ease;top:0;left:0}
  .tooltip.on{opacity:1;visibility:visible}
  .tip-quote{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding-top:8px;
             border-top:1px solid color-mix(in srgb, var(--panel) 25%, transparent);
             font-style:italic;opacity:.92}
  .tip-t{font-family:var(--mono);font-style:normal;font-size:11px;flex:0 0 auto;
         background:color-mix(in srgb, var(--panel) 18%, transparent);border-radius:4px;
         padding:1px 6px}

  /* resolution flag bar (on-page, not in the dropdown) */
  .head-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .flagbar{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);
           border-radius:9px;padding:3px;gap:2px}
  .flag{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
        padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);
        text-transform:capitalize;transition:background .12s,color .12s}
  .flag:hover{color:var(--ink)}
  .flag:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .flag.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
  .flag-n{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .flag.on .flag-n{color:var(--accent)}

  /* filter panel */
  .filter-wrap{position:relative}
  .filter-btn{display:inline-flex;align-items:center;gap:7px}
  .filter-count{font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--accent);
                color:#fff;border-radius:99px;padding:1px 7px;margin-left:2px}
  .filter-panel{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:30;
                width:290px;max-height:60vh;overflow-y:auto;background:var(--panel);
                border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);
                padding:10px}
  .filter-panel.open{display:block}
  .filter-group + .filter-group{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
  .filter-group-head{display:flex;align-items:baseline;justify-content:space-between;
                     font-family:var(--mono);font-size:10px;letter-spacing:.12em;
                     text-transform:uppercase;color:var(--muted);padding:4px 8px 7px}
  .filter-clear,.filter-clear-all{all:unset;cursor:pointer;color:var(--accent);
                                  font-family:var(--sans);font-size:11px;letter-spacing:0;
                                  text-transform:none}
  .filter-clear:hover,.filter-clear-all:hover{text-decoration:underline}
  .filter-clear-all{display:block;width:100%;text-align:center;padding:9px 0 4px;
                    border-top:1px solid var(--border);margin-top:8px;font-size:12px}
  .filter-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;
              cursor:pointer;font-size:12.5px}
  .filter-row:hover{background:var(--panel-2)}
  .filter-row input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex:0 0 14px}
  .filter-label{flex:1;color:var(--ink);text-transform:capitalize}
  .filter-n{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .filter-empty{padding:14px;font-size:12.5px;color:var(--dim);text-align:center}
  /* active-filter chips */
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .f-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
          background:var(--accent-soft-bg);color:var(--accent-soft-fg);border-radius:99px;
          padding:4px 10px;font-size:12px;text-transform:capitalize;
          border:1px solid transparent;transition:border-color .12s}
  .f-chip:hover{border-color:var(--accent)}
  .f-chip-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
            opacity:.7}
  .f-chip-x{font-size:14px;line-height:1;opacity:.7}

  /* sortable headers */
  th.th-sort{cursor:pointer;user-select:none;white-space:nowrap;transition:color .12s}
  th.th-sort:hover{color:var(--accent)}
  th.th-sort:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  th.th-sort.on{color:var(--accent)}
  .th-arrow{margin-left:5px;font-size:9px;opacity:.45;font-family:var(--sans)}
  th.th-sort.on .th-arrow{opacity:1}
  th.th-sort:hover .th-arrow{opacity:.9}

  /* pagination */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
         padding:14px 4px 4px}
  .pager-info{font-size:12.5px;color:var(--muted)}
  .pager-info b{font-family:var(--mono);color:var(--ink);font-weight:600}
  .pager-nav{display:flex;align-items:center;gap:5px}
  .pg{all:unset;cursor:pointer;min-width:31px;height:31px;padding:0 8px;border-radius:7px;
      border:1px solid var(--border);background:var(--panel);color:var(--body);
      font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;
      justify-content:center;transition:border-color .12s,background .12s}
  .pg:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .pg:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .pg.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .pg:disabled{opacity:.42;cursor:default}
  .pg-gap{color:var(--dim);font-family:var(--mono);font-size:12px;padding:0 2px}

  /* sibling-call widgets */
  .ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-top:2px}
  @media(max-width:980px){.ctx-grid{grid-template-columns:1fr}}
  .ctx-stats{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);
             padding-bottom:11px;border-bottom:1px solid var(--border);margin-bottom:4px}
  .ctx-stats b{font-family:var(--mono);color:var(--ink);font-weight:700}
  .ctx-note{font-size:12.5px;color:var(--muted);padding:9px 0 4px;line-height:1.5}
  .ctx-flag{display:flex;gap:9px;align-items:flex-start;background:var(--hot-soft-bg);
            border:1px solid var(--hot-soft-fg);border-radius:8px;padding:10px 12px;
            font-size:12.5px;color:var(--ink);line-height:1.5;margin-bottom:12px}
  .ctx-flag svg{width:15px;height:15px;flex:0 0 15px;color:var(--hot-soft-fg);margin-top:2px}
  .ctx-list{display:flex;flex-direction:column;max-height:392px;overflow-y:auto;
            margin:0 -6px;padding:0 6px}
  .ctx-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;
           padding:11px 8px;border-top:1px solid var(--border);cursor:pointer;
           border-radius:7px;transition:background .12s}
  .ctx-row:first-child{border-top:none}
  .ctx-row:hover{background:var(--panel-2)}
  .ctx-row .score{min-width:34px;font-size:12px;padding:4px 0}
  .ctx-mid{min-width:0}
  .ctx-head{font-size:13px;font-weight:600;color:var(--ink)}
  .ctx-dim{color:var(--dim);font-weight:400}
  .ctx-sum{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ctx-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
  .ctx-empty{color:var(--dim);font-size:12.5px;padding:20px 0;text-align:center}
  .empty{color:var(--dim);padding:50px;text-align:center;font-size:13.5px}
  .spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
           border-top-color:var(--accent);animation:spin .7s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:360px}
  .toast{background:var(--panel);border:1px solid var(--border);color:var(--ink);padding:11px 14px;
         border-radius:9px;box-shadow:var(--shadow);font-size:13px;transition:opacity .2s,transform .2s;
         border-left:3px solid var(--accent);white-space:pre-line}
  .toast.err{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--warn)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(15,18,32,.45);z-index:35}
  @media(max-width:900px){
    .sidebar{position:fixed;top:0;left:0;z-index:40;box-shadow:var(--shadow);opacity:1}
    .app.collapsed .sidebar{width:var(--sidebar-w);flex-basis:var(--sidebar-w);border-right:1px solid var(--border);
                             opacity:1;transform:translateX(-100%)}
    .app:not(.collapsed) .scrim{display:block}
    .main{padding:18px 16px 60px}
    .topbar{padding:12px 14px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-inner">
      <div class="logo-block">
        <div class="logo-icon">@</div>
        <div>
          <div class="logo-name">Call Radar</div>
          <div class="logo-sub">Operational<br>Intelligence</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-spacer"></div>
      <div class="user-card">
        <div class="avatar av-3">MG</div>
        <div class="user-info">
          <div class="user-name">Manager</div>
          <div class="user-role"><span class="dot-online"></span> On duty</div>
        </div>
      </div>
    </div>
  </aside>
  <div class="content-col">
    <header class="topbar">
      <button class="icon-btn" id="railToggle" title="Toggle sidebar"></button>
      <div class="search-box">
        <span id="searchIcon"></span>
        <input id="globalSearch" placeholder="Search..." autocomplete="off">
        <span class="kbd">⌘K</span>
      </div>
      <button class="icon-btn" id="filterBtn" title="Filter"></button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme"></button>
      <div class="profile-menu">
        <button class="profile-trigger" id="profileTrigger">
          <span>Profile</span>
          <span class="avatar av-3" style="width:24px;height:24px;font-size:9.5px;flex:0 0 24px">MG</span>
          <span id="chevIcon"></span>
        </button>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="pd-row"><b>Manager</b><br><span class="dim">Global Ops · On duty</span></div>
          <div class="pd-sep"></div>
          <button class="pd-item" id="pdTheme">Toggle theme</button>
          <button class="pd-item" disabled>Sign out</button>
        </div>
      </div>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>
<input type="file" id="fileInput" accept=".zip" style="display:none">
<div class="toasts" id="toasts"></div>

<script>
const ICONS = {
  menu: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`,
  sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.6" y1="4.6" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.4" y2="4.6"/></svg>`,
  moon: `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.3" y2="15.3"/></svg>`,
  filter: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"/></svg>`,
  chev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  cog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>`,

/* ---------- simple inline SVG charts ---------- */
function barChart(data, w=520, h=230){
  const max=Math.max(...data.map(d=>d.n),1);
  const padL=8, padB=26, padT=10, innerW=w-padL*2, innerH=h-padT-padB;
  const bw = innerW/data.length*0.55, gap = innerW/data.length;
  const peak = Math.max(...data.map(d=>d.n));
  let bars="", labels="";
  data.forEach((d,i)=>{
    const bh = (d.n/max)*innerH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + innerH - bh;
    const isPeak = d.n===peak;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4"
             fill="${isPeak?'var(--ink)':'var(--accent-soft-bg)'}"></rect>`;
    labels += `<text x="${(x+bw/2).toFixed(1)}" y="${h-6}" font-size="10.5" text-anchor="middle"
               fill="var(--muted)" font-family="var(--mono)">${d.label}</text>`;
  });
  for(let i=0;i<=3;i++){
    const y = padT + innerH - (innerH*i/3);
    bars += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padL}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"></line>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${bars}${labels}</svg>`;
}
function lineChart(data, w=380, h=230){
  if(!data.length) return `<div class="empty">No data yet.</div>`;
  const vals = data.map(d=>d.avg_attention);
  const max = Math.max(...vals,10), min = Math.min(...vals,0);
  const padL=30, padB=22, padT=10, innerW=w-padL-10, innerH=h-padT-padB;
  const range = (max-min)||1;
  const pts = data.map((d,i)=>{
    const x = padL + (data.length===1?innerW/2:innerW*i/(data.length-1));
    const y = padT + innerH - ((d.avg_attention-min)/range)*innerH;
    return [x,y];
  });
  const poly = pts.map(p=>p.join(",")).join(" ");
  const areaPts = `${padL},${padT+innerH} ${poly} ${padL+innerW},${padT+innerH}`;
  let gridY="", gridLabels="";
  for(let i=0;i<=3;i++){
    const y = padT + innerH - (innerH*i/3);
    const val = Math.round(min + range*i/3);
    gridY += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-10}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"></line>`;
    gridLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9.5" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${val}</text>`;
  }
  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--accent)"></circle>`).join("");
  const labels = data.map((d,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-4}" font-size="9.5" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${(d.d||"").slice(5)}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    ${gridY}${gridLabels}
    <polygon points="${areaPts}" fill="var(--accent-soft-bg)"></polygon>
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2.2"></polyline>
    ${dots}${labels}
  </svg>`;
}

/* ---------- server-side pagination ---------- */
const PAGE_SIZE = 20;
const pageState = { attention:0, customers:0, agents:0 };

/** Corpus-wide totals for the stat cards. They do not change while paging, so fetch once
 *  and reuse; handleUploadFile clears state.cache when new calls are ingested. */
async function getStats(){
  if(!state.cache.stats) state.cache.stats = await get("/api/stats");
  return state.cache.stats;

// current sort per view; null field = server default ordering
const sortState = { attention:{field:null,dir:"asc"},
                    customers:{field:null,dir:"asc"}, agents:{field:null,dir:"asc"} };
// active filters on Needs Attention; empty set = no constraint on that facet
const filterState = { intents:new Set(), resolutions:new Set() };
const activeFilterCount = ()=> filterState.intents.size + filterState.resolutions.size;

function pageQuery(view, extra=""){
  const q = ($("#globalSearch").value||"").trim();
  const s = sortState[view];
  let out = `?page=${pageState[view]}&size=${PAGE_SIZE}`
    + (q ? `&q=${encodeURIComponent(q)}` : "")
    + (s && s.field ? `&sort=${s.field}&order=${s.dir}` : "");
  if(view === "attention"){
    // repeatable params -- ?intent=a&intent=b, OR'd server-side
    filterState.intents.forEach(v => out += `&intent=${encodeURIComponent(v)}`);
    filterState.resolutions.forEach(v => out += `&resolution=${encodeURIComponent(v)}`);
  }
  return out + extra;
}

const prettyCat = v => v.replace(/_/g," ");

/* ---------- tooltip ----------
   One shared node on <body>, positioned fixed. It cannot live inside the table: the
   .table-card clips overflow, so an absolutely-positioned tooltip would be cut off at
   the card edge. */
let _tipEl = null, _tipTarget = null, _tipText = "";
function _tip(){
  if(!_tipEl){ _tipEl = el("div","tooltip"); document.body.appendChild(_tipEl); }
  return _tipEl;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/** `content` is either a plain string or {summary, t, quote} -- the quote being the
 *  transcript line the judgment cites, so the full evidence reads in one hover. */
function showTip(target, content){
  if(!content) return;
  _tipTarget = target; _tipText = content;
  const t = _tip();
  if(typeof content === "string"){
    t.innerHTML = `<div class="tip-sum">${esc(content)}</div>`;
  } else {
    t.innerHTML = `<div class="tip-sum">${esc(content.summary)}</div>`
      + (content.quote
          ? `<div class="tip-quote"><span class="tip-t">${fmtT(content.t)}</span>`
            + `<span>&ldquo;${esc(content.quote)}&rdquo;</span></div>`
          : "");
  }
  t.classList.add("on");
  const r = target.getBoundingClientRect();
  const tr = t.getBoundingClientRect();
  const margin = 8;
  // prefer above; flip below when there is not enough headroom
  let top = r.top - tr.height - margin;
  if(top < margin) top = r.bottom + margin;
  let left = r.left + r.width/2 - tr.width/2;
  left = Math.max(margin, Math.min(left, window.innerWidth - tr.width - margin));
  t.style.top = `${top}px`;
  t.style.left = `${left}px`;
}
function hideTip(){
  _tipTarget = null; _tipText = "";
  if(_tipEl) _tipEl.classList.remove("on");
}
/** Show `content` on hover/focus of `node`. Keyboard-reachable, so the full summary is
 *  not mouse-only. */
function attachTooltip(node, content){
  if(!content) return node;
  node.tabIndex = 0;
  node.addEventListener("mouseenter", ()=>showTip(node, content));
  node.addEventListener("focus",      ()=>showTip(node, content));
  node.addEventListener("mouseleave", hideTip);
  node.addEventListener("blur",       hideTip);
  return node;
}
// Reposition on scroll rather than hide, so the tooltip stays anchored to its row
// instead of flickering away on a trackpad nudge.
let _tipRaf = null;
window.addEventListener("scroll", ()=>{
  if(!_tipTarget) return;
  if(_tipRaf) cancelAnimationFrame(_tipRaf);
  _tipRaf = requestAnimationFrame(()=>{
    if(_tipTarget) showTip(_tipTarget, _tipText);
  });
}, true);

/** Resolution flag, shown directly on the page rather than buried in the filter panel --
 *  it is the coarsest, most-used cut of the list, so it should be one click away.
 *  Values come from the facets, so a corpus with escalated / follow-up calls gets those
 *  buttons too. Toggling is multi-select; "All" is simply the empty selection. */
async function buildResolutionFlags(reload){
  const wrap = el("div","flagbar");
  let facets;
  try {
    if(!state.cache.facets) state.cache.facets = await get("/api/filters");
    facets = state.cache.facets;
  } catch(e){ return wrap; }

  const draw = ()=>{
    wrap.innerHTML = "";
    const set = filterState.resolutions;
    const mk = (label, count, activeWhen, onClick)=>{
      const b = el("button","flag"+(activeWhen?" on":""),
        `${label}${count!=null?`<span class="flag-n">${count.toLocaleString()}</span>`:""}`);
      b.onclick = ()=>{ onClick(); pageState.attention = 0; draw(); reload(); };
      return b;
    };
    wrap.appendChild(mk("All", null, set.size === 0, ()=> set.clear()));
    facets.resolutions.forEach(r=>{
      wrap.appendChild(mk(prettyCat(r.value), r.n, set.has(r.value),
        ()=> set.has(r.value) ? set.delete(r.value) : set.add(r.value)));
    });
  };
  draw();
  return wrap;
}

/** Filter panel for Needs Attention: intent checkboxes, counts from /api/filters. */
async function buildFilterPanel(reload){
  const wrap = el("div","filter-wrap");
  const btn = el("button","btn filter-btn");
  btn.id = "intentFilterBtn";
  const paint = ()=>{
    const n = filterState.intents.size;      // resolution has its own on-page control
    btn.innerHTML = `${ICONS.filter}<span>Intent</span>`
      + (n ? `<span class="filter-count">${n}</span>` : "");
  };
  paint();
  const panel = el("div","filter-panel");
  wrap.appendChild(btn); wrap.appendChild(panel);
  btn.onclick = (e)=>{ e.stopPropagation(); panel.classList.toggle("open"); };
  panel.onclick = (e)=> e.stopPropagation();
  document.addEventListener("click", ()=> panel.classList.remove("open"));

  // facet counts only change when calls are ingested, and handleUploadFile clears the
  // cache -- so this survives view rebuilds without refetching
  let facets;
  try {
    if(!state.cache.facets) state.cache.facets = await get("/api/filters");
    facets = state.cache.facets;
  }
  catch(e){ panel.appendChild(el("div","filter-empty","Could not load filters.")); return wrap; }

  const group = (title, items, set, labelFn)=>{
    const g = el("div","filter-group");
    const head = el("div","filter-group-head");
    head.appendChild(el("span",null,title));
    const clear = el("button","filter-clear","Clear");
    clear.onclick = ()=>{ set.clear(); rerender(); };
    head.appendChild(clear);
    g.appendChild(head);
    items.forEach(it=>{
      const row = el("label","filter-row");
      const cb = el("input"); cb.type="checkbox"; cb.checked = set.has(it.value);
      cb.onchange = ()=>{ cb.checked ? set.add(it.value) : set.delete(it.value); rerender(); };
      row.appendChild(cb);
      row.appendChild(el("span","filter-label", labelFn(it)));
      row.appendChild(el("span","filter-n", String(it.n)));
      g.appendChild(row);
    });
    return g;
  };

  function rerender(){
    pageState.attention = 0;      // a changed filter invalidates the current page
    paint();
    draw();
    reload();
  }
  function draw(){
    panel.innerHTML = "";
    // resolution lives on the page as a flag bar, so this panel is intent only
    panel.appendChild(group("Intent", facets.intents, filterState.intents,
      it => prettyCat(it.value)));
    if(filterState.intents.size){
      const all = el("button","filter-clear-all","Clear intent filters");
      all.onclick = ()=>{ filterState.intents.clear(); rerender(); };
      panel.appendChild(all);
    }
  }
  draw();
  return wrap;
}

/** Sortable <th>. Clicking toggles asc/desc, a third click clears back to the server
 *  default, and any sort change returns to page 0 -- staying on page 5 of a different
 *  ordering would show unrelated rows. */
function sortableHead(label, field, view, reload, opts={}){
  const s = sortState[view];
  const active = s.field === field;
  const arrow = active ? (s.dir === "asc" ? "▲" : "▼") : "";
  const th = el("th", "th-sort" + (active ? " on" : ""),
    `<span>${label}</span><span class="th-arrow">${arrow || "↕"}</span>`);
  th.tabIndex = 0;
  th.title = `Sort by ${label.toLowerCase()}`;
  const apply = ()=>{
    if(!active)            { s.field = field; s.dir = opts.firstDir || "asc"; }
    else if(s.dir === (opts.firstDir || "asc")) { s.dir = s.dir === "asc" ? "desc" : "asc"; }
    else                   { s.field = null; s.dir = "asc"; }   // third click: back to default
    pageState[view] = 0;
    reload();
  };
  th.onclick = apply;
  th.onkeydown = (e)=>{ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); apply(); } };
  return th;
}

function headRow(cells){
  const tr = el("tr");
  cells.forEach(c => tr.appendChild(typeof c === "string" ? el("th", null, c) : c));
  return tr;
}

/** Pager bar: range summary + windowed page buttons. `reload` re-fetches the view. */
function pager(p, view, reload){
  const bar=el("div","pager");
  const from = p.totalElements ? p.page*p.size + 1 : 0;
  const to = p.page*p.size + p.numberOfElements;
  bar.appendChild(el("div","pager-info",
    `Showing <b>${from.toLocaleString()}–${to.toLocaleString()}</b> of <b>${p.totalElements.toLocaleString()}</b>`));
  const nav=el("div","pager-nav");
  const btn=(label,target,disabled,current)=>{
    const b=el("button","pg"+(current?" on":""),label);
    if(disabled||current){ b.disabled=true; } else { b.onclick=()=>{ pageState[view]=target; reload(); }; }
    return b;
  };
  nav.appendChild(btn(ICONS.chevL, p.page-1, p.first));
  // window of at most 5 page numbers around the current page
  const last=p.totalPages-1;
  let start=Math.max(0, Math.min(p.page-2, last-4)), end=Math.min(last, start+4);
  if(start>0){ nav.appendChild(btn("1",0,false,p.page===0)); if(start>1) nav.appendChild(el("span","pg-gap","…")); }
  for(let i=start;i<=end;i++) nav.appendChild(btn(String(i+1), i, false, i===p.page));
  if(end<last){ if(end<last-1) nav.appendChild(el("span","pg-gap","…")); nav.appendChild(btn(String(last+1), last, false, p.page===last)); }
  nav.appendChild(btn(ICONS.chevR, p.page+1, p.last));
  bar.appendChild(nav);
  return bar;
}

/* ---------- views ---------- */

    <div class="note">Calls prioritized by attention score (0-100).</div>`));
  m.appendChild(head);
  const body=el("div"); body.appendChild(el("div","spinner")); m.appendChild(body);
  state.reloadPage = ()=>loadAttentionPage(body);

// Paging re-renders only the table -- the surrounding chrome does not change, so there is
// no reason to rebuild the page (or refetch /api/stats) to turn a page.
async function loadAttentionPage(body){
  const p=await get("/api/attention"+pageQuery("attention"));
  renderAttentionTable(body, p);
}
function renderAttentionTable(body, p){
  const rows=p.content||[];
  body.innerHTML="";

  // active intent filters as removable chips -- resolution is not chipped because the
  // flag bar above already shows it, and two controls for one filter invites confusion
  if(filterState.intents.size){
    const chips=el("div","chip-row");
    filterState.intents.forEach(val=>{
      const c=el("button","f-chip",
        `<span class="f-chip-k">intent</span>${prettyCat(val)}<span class="f-chip-x">×</span>`);
      c.title=`Remove intent filter: ${prettyCat(val)}`;
      // route() rebuilds the view so the Intent button's count and the panel's
      // checkboxes stay in step with the chips
      c.onclick=()=>{ filterState.intents.delete(val); pageState.attention=0; route(); };
      chips.appendChild(c);
    });
    body.appendChild(chips);
  }

  if(!rows.length){
    const q=($("#globalSearch").value||"").trim();
    body.appendChild(el("div","empty",
      activeFilterCount() ? "No calls match these filters."
      : q ? "No matches." : "No calls yet. Use Bulk Upload to ingest recordings."));
    return;
  }
  const card=el("div","table-card"); const tbl=el("table");
  const reload=()=>loadAttentionPage(body);
  tbl.appendChild(headRow([
    sortableHead("Score", "score", "attention", reload, {firstDir:"desc"}),
    sortableHead("Customer", "customer", "attention", reload),
    sortableHead("Agent", "agent", "attention", reload),
    "Summary",
    sortableHead("Resolution", "resolution", "attention", reload),
    sortableHead("Mood", "mood", "attention", reload, {firstDir:"desc"}),
    "Intent",
    "Action",
  ]));
  rows.forEach(r=>{
    const tr=el("tr");
    tr.innerHTML=`<td>${scoreBadge(r.attention)}</td>
      <td><b style="color:var(--ink)">${r.customer_name}</b></td>
      <td>Agent ${r.agent_name}</td>
      <td class="sum-cell"><div class="sum-clamp">${r.summary||""}</div>${evInline(r.shift_t, r.shift_quote)}</td>
      <td>${resPill(r.resolution)}</td>
      <td>${moodText(r.end_mood)}</td>
      <td>${r.intent_label}</td>
      <td><button class="action-btn" title="Open call">${ICONS.extLink}</button></td>`;
    // summaries are clamped to keep rows uniform; the tooltip carries the full text plus
    // the transcript line the judgment cites
    const clamp = tr.querySelector(".sum-clamp");
    if(clamp && r.summary){
      attachTooltip(clamp, {summary: r.summary, t: r.shift_t, quote: r.shift_quote});
    }
    tr.onclick=()=>openCall(r.sid);
    wireSeekChips(tr, r.sid);
    tbl.appendChild(tr);
  });
  card.appendChild(tbl); body.appendChild(card);
  body.appendChild(pager(p, "attention", ()=>loadAttentionPage(body)));
}

async function loadCustomersPage(body){
  const p=await get("/api/customers"+pageQuery("customers"));
  renderCustomersTable(body, p, (state.cache.stats||{}).latest_ms);
}
function renderCustomersTable(body, p, latestMs){
  const rows=p.content||[];
  body.innerHTML="";
  if(!rows.length){
    body.appendChild(el("div","empty", ($("#globalSearch").value||"").trim()
      ? "No matches." : "No customers yet."));
    return;
  }
  const card=el("div","table-card"); const tbl=el("table");
  const reload=()=>loadCustomersPage(body);
  tbl.appendChild(headRow([
    sortableHead("Customer Name & ID", "name", "customers", reload),
    sortableHead("Total Calls", "calls", "customers", reload, {firstDir:"desc"}),
    sortableHead("Worst Attention Score", "attention", "customers", reload, {firstDir:"desc"}),
    sortableHead("Last Contact", "last_contact", "customers", reload, {firstDir:"desc"}),
    "Actions",
  ]));
  rows.forEach(c=>{
    const sev=sevOf(c.max_attention||0);
    const daysAgo = latestMs ? Math.max(0, Math.round((latestMs - c.last_ms)/86400000)) : null;
    const lastContact = daysAgo==null ? "—" : daysAgo===0 ? "Today" : daysAgo===1 ? "1 day ago" : `${daysAgo} days ago`;
    const tr=el("tr");
    tr.innerHTML=`<td><div class="name-cell">
        <div class="avatar ${avatarClass(c.customer_name)}">${initials(c.customer_name)}</div>
        <div class="meta"><span class="nm">${c.customer_name}</span><span class="id">ID: ${pseudoId("CUS",c.customer_name)}</span></div>
      </div></td>
      <td class="n">${c.n}</td>
      <td><div class="progress"><div class="track"><span class="sev-${sev}" style="width:${Math.min(100,c.max_attention||0)}%"></span></div>
          <span class="num">${c.max_attention||0}</span> ${`<span class="pill sev-${sev}">${sev==="crit"?"critical":sev==="hot"?"hot":sev==="warn"?"warn":"normal"}</span>`}</div></td>
      <td>${lastContact}</td>
      <td><button class="action-btn" title="View history">${ICONS.extLink}</button></td>`;
    tr.onclick=()=>{state.customer=c.customer_name;state.call=null;state.view="customer";route();closeOnMobile();};
    tbl.appendChild(tr);
  });
  card.appendChild(tbl); body.appendChild(card);
  body.appendChild(pager(p, "customers", ()=>loadCustomersPage(body)));
}

async function viewTrends(){
  const m=freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Conversation Trends</h2>
    <div class="note">Analyzing call volumes and resolutions across primary categories.</div></div>
    <button class="btn">${ICONS.upload}<span>Export</span></button>`));
  const body=el("div"); body.appendChild(el("div","spinner")); m.appendChild(body);
  const [cats, timeline] = await Promise.all([get("/api/trends"), get("/api/trends/timeline?days=7")]);
  body.innerHTML="";
  if(!cats.length){ body.appendChild(el("div","empty","No calls yet.")); return; }

  const top = cats[0];
  const overallRate = cats.reduce((a,c)=>a+c.resolved,0)/cats.reduce((a,c)=>a+c.n,0)*100;
  const topRate = 100*top.resolved/top.n;
  const delta = (topRate-overallRate).toFixed(0);
  const insight=el("div","insight");
  insight.innerHTML=`<div class="insight-icon">${ICONS.warnTri}</div>
    <div class="insight-body">
      <div class="insight-label">Top issue by volume</div>
      <div class="insight-title">${top.intent_cat.replace(/_/g," ")}
        <span class="insight-delta">${delta>=0?"+":""}${delta} pts resolution vs avg</span></div>
    </div>
    <button class="btn primary" id="investigateBtn">Investigate Calls ${ICONS.extLink}</button>`;
  body.appendChild(insight);
  insight.querySelector("#investigateBtn").onclick=()=>{
    $("#globalSearch").value = top.intent_cat.replace(/_/g," ");
    state.view="attention"; route();
  };

  const chartsRow=el("div","charts-row");
  const volCard=el("div","card");
  volCard.appendChild(el("h4",null,"Call Volume by Category"));
  volCard.appendChild(el("div",null, barChart(cats.slice(0,6).map(c=>({label:c.intent_cat.replace(/_/g," ").slice(0,10), n:c.n})))));
  const trendCard=el("div","card");
  trendCard.appendChild(el("h4",null,"Attention Score Trend"));
  trendCard.appendChild(el("div",null, lineChart(timeline)));
  if(timeline.length){
    const cur = timeline[timeline.length-1].avg_attention;
    const prev = timeline.length>1 ? timeline[timeline.length-2].avg_attention : cur;
    const d = (cur-prev).toFixed(1);
    const foot=el("div","chart-foot");
    foot.innerHTML=`<div><div class="note">Current avg</div><div class="big">${cur.toFixed(1)}</div></div>
      <div class="delta">${d>=0?"+":""}${d} vs prior day</div>`;
    trendCard.appendChild(foot);
  }
  chartsRow.appendChild(volCard); chartsRow.appendChild(trendCard);
  body.appendChild(chartsRow);

  const tilesWrap=el("div","card");
  tilesWrap.appendChild(el("h4",null,"Resolution Rate per Category"));
  const tiles=el("div","res-tiles");
  cats.slice(0,4).forEach(c=>{
    const pct = Math.round(100*c.resolved/c.n);
    const status = pct>=90?["Optimal","var(--warn-soft-fg)"]:pct>=75?["Stable","var(--muted)"]:["Warning","var(--crit-soft-fg)"];
    const tile=el("div","res-tile"); tile.style.background = pct>=90?"var(--warn-soft-bg)":pct>=75?"var(--panel-2)":"var(--crit-soft-bg)";
    tile.innerHTML=`<div class="cat">${c.intent_cat.replace(/_/g," ")}</div>
      <div class="pct">${pct}%</div><div class="status" style="color:${status[1]}">${status[0]}</div>`;
    tiles.appendChild(tile);
  });
  tilesWrap.appendChild(tiles); body.appendChild(tilesWrap);
}

      </div></td>
      <td class="n">${a.calls}</td>
      <td class="n">${fmtT(a.avg_handle_s)}</td>
      <td class="n">${resPct}%</td>
      <td><div class="progress"><div class="track"><span class="sev-${sev}" style="width:${Math.min(100,a.avg_attention||0)}%"></span></div>
          <span class="num">${Math.round(a.avg_attention)}</span></div> ${okwarn}</td>
      <td><span class="pill sev-${clarSev}">${a.clarification_signal}</span></td>`;
    tbl.appendChild(tr);
  });
  card.appendChild(tbl); body.appendChild(card);
  body.appendChild(pager(p, "agents", ()=>loadAgentsPage(body)));
