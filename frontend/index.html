<!doctype html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('cr-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call-Centre Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --sidebar-bg:#eef0fb; --panel:#ffffff; --panel-2:#f4f5fb; --border:#e3e6f0;
    --ink:#12172b; --body:#2b3350; --muted:#6b7280; --dim:#98a1b3;
    --agent:#2563a8; --caller:#a8720a;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-ink:#ffffff;
    --accent-soft-bg:#e9e8fb; --accent-soft-fg:#4338ca;
    --crit:#dc2626;    --crit-soft-bg:#fde3e3; --crit-soft-fg:#b91c1c;
    --hot:#c2410c;     --hot-soft-bg:#ffedd5;  --hot-soft-fg:#9a3412;
    --warn:#0d9488;    --warn-soft-bg:#ccfbf1; --warn-soft-fg:#0f766e;
    --ok:#4f46e5;      --ok-soft-bg:#e9e8fb;   --ok-soft-fg:#4338ca;
    --shadow:0 12px 32px rgba(30,35,70,.10);
    --shadow-sm:0 2px 8px rgba(30,35,70,.06);
    --radius:12px;
    --av-bg-l:88%; --av-fg-l:34%;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --sidebar-w:264px;
  }
  :root[data-theme="dark"]{
    --bg:#0f1220; --sidebar-bg:#161a2c; --panel:#1b2036; --panel-2:#222842; --border:#2b3150;
    --ink:#eef0fa; --body:#cdd3e6; --muted:#9aa3c0; --dim:#6b7396;
    --agent:#6fb1e8; --caller:#e8b04b;
    --accent:#8b85f5; --accent-hover:#a29cf7; --accent-ink:#0f1220;
    --accent-soft-bg:#292763; --accent-soft-fg:#c7c2fb;
    --crit:#f0555a;    --crit-soft-bg:rgba(240,85,90,.16);  --crit-soft-fg:#ff9d9f;
    --hot:#f0824a;     --hot-soft-bg:rgba(240,130,74,.16);  --hot-soft-fg:#ffb27e;
    --warn:#2fc4b4;    --warn-soft-bg:rgba(47,196,180,.16); --warn-soft-fg:#7de8db;
    --ok:#8b85f5;      --ok-soft-bg:rgba(139,133,245,.18);  --ok-soft-fg:#c7c2fb;
    --shadow:0 12px 32px rgba(0,0,0,.40);
    --shadow-sm:0 2px 10px rgba(0,0,0,.32);
    --av-bg-l:24%; --av-fg-l:80%;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  html[data-theme="dark"]{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit}
  h1,h2,h3{font-family:var(--sans);color:var(--ink)}
  ::selection{background:var(--accent);color:#fff}

  .app{display:flex;min-height:100vh}
  /* ---- sidebar ---- */
  .sidebar{background:var(--sidebar-bg);border-right:1px solid var(--border);
           width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;
           overflow:hidden;transition:width .2s ease,flex-basis .2s ease,opacity .16s ease}
  .app.collapsed .sidebar{width:0;flex-basis:0;opacity:0;border-right:none}
  .sidebar-inner{width:var(--sidebar-w);display:flex;flex-direction:column;height:100%;padding:20px 16px}
  .logo-block{display:flex;align-items:center;gap:11px;padding:4px 6px 22px}
  .logo-icon{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;
             display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 38px}
  .logo-name{font-weight:800;font-size:17px;color:var(--accent);letter-spacing:-.01em}
  .logo-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
            color:var(--muted);line-height:1.35;margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;color:var(--body);
              font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:11px;
              transition:background .12s,color .12s}
  .nav button svg{width:17px;height:17px;flex:0 0 17px;color:var(--muted)}
  .nav button:hover{background:var(--panel)}
  .nav button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm)}
  .nav button.on svg{color:var(--accent)}
  .sidebar-spacer{flex:1}
  .user-card{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;
             background:var(--panel);border:1px solid var(--border)}
  .user-info{display:flex;flex-direction:column;gap:1px;min-width:0}
  .user-name{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-role{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .dot-online{width:6px;height:6px;border-radius:50%;background:var(--warn);display:inline-block}

  /* ---- content column ---- */
  .content-col{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
          display:flex;align-items:center;gap:12px;padding:14px 26px}
  .icon-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:9px;color:var(--muted);
            display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;flex:0 0 36px}
  .icon-btn:hover{background:var(--panel-2);color:var(--ink)}
  .icon-btn svg{width:17px;height:17px}
  .search-box{flex:1;max-width:640px;display:flex;align-items:center;gap:9px;background:var(--panel);
              border:1px solid var(--border);border-radius:10px;padding:9px 13px;transition:border-color .15s}
  .search-box:focus-within{border-color:var(--accent)}
  .search-box svg{width:15px;height:15px;color:var(--dim);flex:0 0 15px}
  .search-box input{all:unset;flex:1;font-size:13px;color:var(--ink)}
  .search-box input::placeholder{color:var(--dim)}
  .kbd{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--border);
       border-radius:5px;padding:2px 6px;background:var(--panel-2)}
  .profile-menu{position:relative}
  .profile-trigger{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;
                   border-radius:10px;font-size:13px;color:var(--body);transition:background .12s}
  .profile-trigger:hover{background:var(--panel-2)}
  .profile-trigger svg{width:13px;height:13px;color:var(--dim)}
  .profile-dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);
                    border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);
                    width:200px;padding:8px;display:none;z-index:30}
  .profile-dropdown.open{display:block}
  .pd-row{padding:8px 10px;font-size:13px}
  .pd-row .dim{color:var(--muted);font-size:11.5px}
  .pd-sep{height:1px;background:var(--border);margin:6px 2px}
  .pd-item{all:unset;cursor:pointer;display:block;width:100%;padding:8px 10px;border-radius:7px;
           font-size:12.5px;color:var(--body)}
  .pd-item:hover{background:var(--panel-2)}
  .pd-item[disabled]{color:var(--dim);cursor:default}
  .pd-item[disabled]:hover{background:none}

  .main{flex:1;min-width:0;padding:26px 30px 70px;opacity:1;transition:opacity .15s ease}
  .main.enter{opacity:0}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .page-head h2{margin:0 0 6px;font-size:25px;font-weight:800;letter-spacing:-.015em}
  .page-head .note{color:var(--muted);font-size:13px}
  .btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--body);display:inline-flex;
       align-items:center;gap:7px;border:1px solid var(--border);padding:9px 15px;border-radius:9px;
       background:var(--panel);transition:border-color .15s,box-shadow .15s}
  .btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft-bg)}
  .btn svg{width:14px;height:14px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:none}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat-card{background:var(--accent-soft-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .stat-card .label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
                     color:var(--muted);margin-bottom:8px}
  .stat-card .value{font-size:25px;font-weight:800;color:var(--ink);font-family:var(--mono)}
  .stat-card .value.tone-warn{color:var(--hot)}
  .stat-card .status-row{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--warn)}
  .stat-card .status-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}

  /* generic card + table */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
        padding:18px 20px;margin-bottom:16px}
  .card h4{margin:0 0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
           display:flex;align-items:center;gap:6px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:14px 14px;font-size:13.5px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{font-family:var(--mono);color:var(--muted);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
     font-weight:600;background:var(--panel-2)}
  th:first-child{border-top-left-radius:var(--radius)} th:last-child{border-top-right-radius:var(--radius)}
  tbody tr{transition:background .12s;cursor:pointer}
  tbody tr:hover{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:none}
  .table-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}

  /* score squares + soft pills */
  .score{font-family:var(--mono);font-weight:700;font-size:13px;color:#fff;border-radius:8px;
         padding:6px 0;min-width:38px;text-align:center;display:inline-block}
  .score.sev-crit{background:var(--crit)} .score.sev-hot{background:var(--hot)}
  .score.sev-warn{background:var(--warn)} .score.sev-ok{background:var(--ok)}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
        padding:4px 10px;border-radius:20px;display:inline-block}
  .pill.sev-crit{background:var(--crit-soft-bg);color:var(--crit-soft-fg)}
  .pill.sev-hot{background:var(--hot-soft-bg);color:var(--hot-soft-fg)}
  .pill.sev-warn{background:var(--warn-soft-bg);color:var(--warn-soft-fg)}
  .pill.sev-ok{background:var(--ok-soft-bg);color:var(--ok-soft-fg)}
  .pill.solid{color:#fff}
  .pill.solid.sev-crit{background:var(--crit)} .pill.solid.sev-hot{background:var(--hot)}
  .pill.solid.sev-warn{background:var(--warn)} .pill.solid.sev-ok{background:var(--ok)}
  .mood-text{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .mood-text.m-positive{color:var(--warn-soft-fg)} .mood-text.m-calm{color:var(--muted)}
  .mood-text.m-concerned{color:var(--hot-soft-fg)} .mood-text.m-frustrated{color:var(--crit-soft-fg)}

  /* evidence chip inline in tables */
  .ev-inline{display:inline-flex;align-items:flex-start;gap:9px;background:var(--panel-2);border:1px solid var(--border);
             border-radius:8px;padding:8px 11px;margin-top:8px;max-width:480px;cursor:pointer;transition:border-color .12s}
  .ev-inline:hover{border-color:var(--accent)}
  .ev-inline .t{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent);
                background:var(--accent-soft-bg);border-radius:5px;padding:3px 6px;flex:0 0 auto}
  .ev-inline .q{font-size:12px;font-style:italic;color:var(--body)}

  .progress{display:flex;align-items:center;gap:9px}
  .progress .track{width:96px;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden}
  .progress .track>span{display:block;height:100%;border-radius:4px}
  .progress .track>span.sev-crit{background:var(--crit)} .progress .track>span.sev-hot{background:var(--hot)}
  .progress .track>span.sev-warn{background:var(--warn)} .progress .track>span.sev-ok{background:var(--ok)}
  .progress .num{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink);min-width:20px}

  .name-cell{display:flex;align-items:center;gap:11px}
  .name-cell .meta{display:flex;flex-direction:column;gap:1px;min-width:0}
  .name-cell .nm{font-weight:600;color:var(--ink);font-size:13.5px}
  .name-cell .id{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          font-size:11.5px;font-weight:700;flex:0 0 34px}
  .av-0{background:hsl(210 70% var(--av-bg-l));color:hsl(210 70% var(--av-fg-l))}
  .av-1{background:hsl(280 55% var(--av-bg-l));color:hsl(280 55% var(--av-fg-l))}
  .av-2{background:hsl(340 65% var(--av-bg-l));color:hsl(340 65% var(--av-fg-l))}
  .av-3{background:hsl(24 75% var(--av-bg-l));color:hsl(24 75% var(--av-fg-l))}
  .av-4{background:hsl(48 75% var(--av-bg-l));color:hsl(48 75% var(--av-fg-l))}
  .av-5{background:hsl(165 55% var(--av-bg-l));color:hsl(165 55% var(--av-fg-l))}
  .av-6{background:hsl(100 40% var(--av-bg-l));color:hsl(100 40% var(--av-fg-l))}
  .av-7{background:hsl(255 55% var(--av-bg-l));color:hsl(255 55% var(--av-fg-l))}

  .action-btn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;color:var(--muted);
              display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .action-btn:hover{background:var(--accent-soft-bg);color:var(--accent)}
  .action-btn svg{width:15px;height:15px}

  /* insight banner (Trends) */
  .insight{display:flex;align-items:center;gap:16px;background:var(--crit-soft-bg);border:1px solid var(--crit-soft-fg);
           border-radius:var(--radius);padding:16px 20px;margin-bottom:22px}
  .insight-icon{width:38px;height:38px;border-radius:9px;background:var(--panel);display:flex;align-items:center;
                justify-content:center;color:var(--crit);flex:0 0 38px}
  .insight-icon svg{width:19px;height:19px}
  .insight-body{flex:1;min-width:0}
  .insight-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
                 color:var(--crit-soft-fg);font-weight:700;margin-bottom:3px}
  .insight-title{font-size:17px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px}
  .insight-delta{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--crit);
                 background:var(--panel);border-radius:20px;padding:3px 10px}

  .charts-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:900px){.charts-row{grid-template-columns:1fr}}
  .chart-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
  .chart-foot .big{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--ink)}
  .chart-foot .delta{font-family:var(--mono);font-size:12px;color:var(--warn-soft-fg);font-weight:700}

  .res-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:900px){.res-tiles{grid-template-columns:repeat(2,1fr)}}
  .res-tile{border-radius:11px;padding:15px 17px;border:1px solid var(--border)}
  .res-tile .cat{font-size:13px;color:var(--muted);margin-bottom:6px}
  .res-tile .pct{font-family:var(--mono);font-size:21px;font-weight:800;color:var(--ink)}
  .res-tile .status{float:right;font-size:11.5px;font-weight:700;margin-top:10px}

  /* bulk upload */
  .dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:52px 20px;text-align:center;
            background:var(--panel-2);transition:border-color .15s,background .15s;cursor:pointer}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft-bg)}
  .dropzone .cloud{color:var(--dim);margin-bottom:14px}
  .dropzone .cloud svg{width:38px;height:38px}
  .dropzone .title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .dropzone .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .queue-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
  .queue-head h4{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .queue-count{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .q-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .q-item-top{display:flex;align-items:center;gap:11px}
  .q-item .qi-icon{width:30px;height:30px;border-radius:8px;background:var(--panel-2);display:flex;
                    align-items:center;justify-content:center;color:var(--muted);flex:0 0 30px}
  .q-item .qi-icon svg{width:15px;height:15px}
  .q-item .qi-name{flex:1;font-size:13px;font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-item .qi-status{font-family:var(--mono);font-size:11.5px;font-weight:700;flex:0 0 auto}
  .q-item .qi-status.processing{color:var(--muted)}
  .q-item .qi-status.ok{color:var(--warn-soft-fg)}
  .q-item .qi-status.err{color:var(--crit-soft-fg)}
  .q-item .qi-bar{height:4px;border-radius:3px;background:var(--panel-2);margin-top:9px;overflow:hidden}
  .q-item .qi-bar>span{display:block;height:100%;background:var(--accent);border-radius:3px;animation:indet 1.1s ease-in-out infinite}
  @keyframes indet{0%{width:15%;margin-left:0%}50%{width:55%;margin-left:45%}100%{width:15%;margin-left:85%}}
  .q-sub{margin-top:10px;padding-left:41px;display:flex;flex-direction:column;gap:6px}
  .q-sub-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .q-sub-row svg{width:13px;height:13px;flex:0 0 13px}
  .q-sub-row.ok{color:var(--warn-soft-fg)} .q-sub-row.err{color:var(--crit-soft-fg)}
  .q-sub-row a{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}

  /* call detail (reused structure, new tokens) */
  .grid2{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:980px){.grid2{grid-template-columns:1fr}}
  audio{width:100%;margin-top:4px}
  .summary-text{font-size:15px;line-height:1.6;color:var(--ink)}
  .turn{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--border);transition:background .15s}
  .turn:first-child{border-top:none}
  .ts{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--dim);
      min-width:46px;padding-top:2px;border-radius:4px}
  .ts:hover{color:var(--accent)}
  .turn .body{flex:1}
  .spk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .spk.agent{color:var(--agent)} .spk.caller{color:var(--caller)}
  .turn.hl{background:var(--accent-soft-bg);border-radius:6px;margin:0 -8px;padding:8px}
  .mood-row{display:flex;align-items:center;gap:0;margin-top:6px}
  .track-line{flex:1;height:3px;background:linear-gradient(90deg,var(--warn),var(--crit));
              margin:0 10px;position:relative;border-radius:2px}
  .marker{position:absolute;top:-4.5px;width:11px;height:11px;border-radius:50%;
          background:var(--hot);border:2px solid var(--panel);cursor:pointer}
  .ev{background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--accent);
      border-radius:6px;padding:9px 11px;margin-top:8px;cursor:pointer;transition:border-color .12s}
  .ev:hover{border-left-color:var(--caller)}
  .ev .q{font-size:12.5px;color:var(--ink);font-style:italic}
  .ev .at{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-top:3px}
  .note-line{color:var(--muted);font-size:12.5px}
  .reasons{list-style:none;margin:0;padding:0}
  .reasons li{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;
              border-top:1px solid var(--border);color:var(--muted)}
  .reasons li:first-child{border-top:none}
  .reasons b{font-family:var(--mono);color:var(--ink);font-weight:700}
  .back{all:unset;cursor:pointer;color:var(--accent);font-size:12.5px;margin-bottom:14px;display:inline-flex;
        align-items:center;gap:6px;font-weight:600}
  .back svg{width:13px;height:13px}

  .empty{color:var(--dim);padding:50px;text-align:center;font-size:13.5px}
  .spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
           border-top-color:var(--accent);animation:spin .7s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:360px}
  .toast{background:var(--panel);border:1px solid var(--border);color:var(--ink);padding:11px 14px;
         border-radius:9px;box-shadow:var(--shadow);font-size:13px;transition:opacity .2s,transform .2s;
         border-left:3px solid var(--accent);white-space:pre-line}
  .toast.err{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--warn)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(15,18,32,.45);z-index:35}
  @media(max-width:900px){
    .sidebar{position:fixed;top:0;left:0;z-index:40;box-shadow:var(--shadow);opacity:1}
    .app.collapsed .sidebar{width:var(--sidebar-w);flex-basis:var(--sidebar-w);border-right:1px solid var(--border);
                             opacity:1;transform:translateX(-100%)}
    .app:not(.collapsed) .scrim{display:block}
    .main{padding:18px 16px 60px}
    .topbar{padding:12px 14px}
  }
</style>
</head>

<script>
const ICONS = {

  bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  users2: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  trend: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="14 6 21 6 21 13"/></svg>`,
  headset: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h3z"/><path d="M3 15a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H3z"/><path d="M17 17v1a3 3 0 0 1-3 3h-2"/></svg>`,
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 8l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>`,
  extLink: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  alertCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
  warnTri: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
};

const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const get = p => fetch(p).then(r=>r.json());
const fmtT = s => s==null?"—":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const sevOf = n => n>=75?"crit":n>=50?"hot":n>=25?"warn":"ok";
const state = {view:"attention", customer:null, call:null, cache:{}, uploads:[]};

/* ---------- chrome: theme, sidebar, search, profile, toast ---------- */
const THEME_KEY="cr-theme", SIDEBAR_KEY="cr-sidebar";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem(THEME_KEY, t);
  const btn=$("#themeToggle"); if(btn) btn.innerHTML = t==="dark" ? ICONS.sun : ICONS.moon;
}
function isNarrow(){ return window.matchMedia("(max-width:900px)").matches; }
function getCollapsed(){
  const saved = localStorage.getItem(SIDEBAR_KEY);
  if(saved!==null) return saved==="1";
  return isNarrow();
}
function setCollapsed(c){
  $("#app").classList.toggle("collapsed", c);
  localStorage.setItem(SIDEBAR_KEY, c?"1":"0");
}
function closeOnMobile(){ if(isNarrow()) setCollapsed(true); }
function toast(msg, kind="ok", ms=5200){
  const box=$("#toasts"); const t=el("div","toast "+kind); t.textContent=msg;
  box.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transform="translateY(-6px)"; setTimeout(()=>t.remove(),220); }, ms);
}
function freshMain(){ const m=$("#main"); m.classList.add("enter"); m.innerHTML=""; requestAnimationFrame(()=>m.classList.remove("enter")); return m; }
function initials(name){
  const parts=(name||"?").trim().split(/\s+/);
  return ((parts[0]?.[0]||"")+(parts[1]?.[0]||parts[0]?.[1]||"")).toUpperCase();
}
function hashName(name){ let h=0; for(const ch of (name||"")) h=(h*31+ch.charCodeAt(0))>>>0; return h; }
function avatarClass(name){ return "av-"+(hashName(name)%8); }
function pseudoId(prefix,name){ return prefix+"-"+String(hashName(name)%100000).padStart(5,"0"); }

const SEARCH_PLACEHOLDERS = {
  attention:"Search transcripts, customers, agents...", customers:"Search customer names or IDs...",
  trends:"Search trends...", agents:"Search agents, skills...", upload:"Search...",
  customer:"Search this customer's calls...",
};
function setSearchPlaceholder(){ $("#globalSearch").placeholder = SEARCH_PLACEHOLDERS[state.view] || "Search..."; }

/* ---------- reusable pieces ---------- */
function scoreBadge(n){ return `<span class="score sev-${sevOf(n)}">${n}</span>`; }
function resPill(res){ const sev = res==="unresolved"?"crit":res==="escalated"?"hot":res==="follow_up_promised"?"warn":"ok";
  return `<span class="pill sev-${sev}">${res.replace(/_/g," ")}</span>`; }
function moodText(m){ return `<span class="mood-text m-${m}">${m}</span>`; }
function statCards(items){
  const wrap=el("div","stats");
  items.forEach(it=>{
    const c=el("div","stat-card");
    c.appendChild(el("div","label",it.label));
    if(it.status){
      c.appendChild(el("div","status-row",`<span class="status-dot"></span>${it.value}`));
    } else {
      c.appendChild(el("div","value"+(it.tone==="warn"?" tone-warn":""),String(it.value)));
    }
    wrap.appendChild(c);
  });
  return wrap;
}
function evInline(t, quote){
  if(t==null || !quote) return "";
  return `<div class="ev-inline" data-seek="${t}"><span class="t">${fmtT(t)}</span><span class="q">"${quote}"</span></div>`;
}
function wireSeekChips(container, sid){
  container.querySelectorAll("[data-seek]").forEach(n=>{
    n.onclick = (e)=>{ e.stopPropagation(); openCall(sid, parseFloat(n.dataset.seek)); };
  });
}

/* ---------- nav ---------- */
const NAV = [["attention","Needs Attention","bell"],["customers","Customers","users2"],
             ["trends","Trends","trend"],["agents","Agents","headset"],["upload","Bulk Upload","upload"]];
function renderNav(){
  const n=$("#nav"); n.innerHTML="";
  NAV.forEach(([k,label,icon])=>{
    const b=el("button",state.view===k&&!state.call?"on":"", `${ICONS[icon]}<span>${label}</span>`);
    b.onclick=()=>{state.call=null;state.customer=null;state.view=k;route();closeOnMobile();};
    n.appendChild(b);
  });
}

/* ---------- simple inline SVG charts ---------- */
function barChart(data, w=520, h=230){
  const max=Math.max(...data.map(d=>d.n),1);
  const padL=8, padB=26, padT=10, innerW=w-padL*2, innerH=h-padT-padB;
  const bw = innerW/data.length*0.55, gap = innerW/data.length;
  const peak = Math.max(...data.map(d=>d.n));
  let bars="", labels="";
  data.forEach((d,i)=>{
    const bh = (d.n/max)*innerH;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + innerH - bh;
    const isPeak = d.n===peak;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4"
             fill="${isPeak?'var(--ink)':'var(--accent-soft-bg)'}"></rect>`;
    labels += `<text x="${(x+bw/2).toFixed(1)}" y="${h-6}" font-size="10.5" text-anchor="middle"
               fill="var(--muted)" font-family="var(--mono)">${d.label}</text>`;
  });
  for(let i=0;i<=3;i++){
    const y = padT + innerH - (innerH*i/3);
    bars += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padL}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"></line>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${bars}${labels}</svg>`;
}
function lineChart(data, w=380, h=230){
  if(!data.length) return `<div class="empty">No data yet.</div>`;
  const vals = data.map(d=>d.avg_attention);
  const max = Math.max(...vals,10), min = Math.min(...vals,0);
  const padL=30, padB=22, padT=10, innerW=w-padL-10, innerH=h-padT-padB;
  const range = (max-min)||1;
  const pts = data.map((d,i)=>{
    const x = padL + (data.length===1?innerW/2:innerW*i/(data.length-1));
    const y = padT + innerH - ((d.avg_attention-min)/range)*innerH;
    return [x,y];
  });
  const poly = pts.map(p=>p.join(",")).join(" ");
  const areaPts = `${padL},${padT+innerH} ${poly} ${padL+innerW},${padT+innerH}`;
  let gridY="", gridLabels="";
  for(let i=0;i<=3;i++){
    const y = padT + innerH - (innerH*i/3);
    const val = Math.round(min + range*i/3);
    gridY += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-10}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"></line>`;
    gridLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9.5" text-anchor="end" fill="var(--muted)" font-family="var(--mono)">${val}</text>`;
  }
  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--accent)"></circle>`).join("");
  const labels = data.map((d,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-4}" font-size="9.5" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${(d.d||"").slice(5)}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    ${gridY}${gridLabels}
    <polygon points="${areaPts}" fill="var(--accent-soft-bg)"></polygon>
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2.2"></polyline>
    ${dots}${labels}
  </svg>`;
}

/* ---------- views ---------- */
async function viewAttention(){
  const m=freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Needs Attention Today</h2>
    <div class="note">Calls prioritized by attention score (0-100).</div></div>`));
  const body=el("div"); body.appendChild(el("div","spinner")); m.appendChild(body);
  const rows=await get("/api/attention?limit=100");
  state.cache.attention = rows;
  renderAttentionTable(body, rows);
}
function renderAttentionTable(body, rows){
  const q=($("#globalSearch").value||"").toLowerCase();
  const filtered = q ? rows.filter(r=>[r.customer_name,r.agent_name,r.summary,r.intent_label].join(" ").toLowerCase().includes(q)) : rows;
  body.innerHTML="";
  if(!filtered.length){ body.appendChild(el("div","empty", rows.length?"No matches.":"No calls yet. Use Bulk Upload to ingest recordings.")); return; }
  const card=el("div","table-card"); const tbl=el("table");
  tbl.innerHTML="<tr><th>Score</th><th>Customer</th><th>Agent</th><th>Summary</th><th>Resolution</th><th>Mood</th><th>Intent</th><th>Action</th></tr>";
  filtered.forEach(r=>{
    const tr=el("tr");
    tr.innerHTML=`<td>${scoreBadge(r.attention)}</td>
      <td><b style="color:var(--ink)">${r.customer_name}</b></td>
      <td>Agent ${r.agent_name}</td>
      <td style="max-width:320px"><div>${r.summary||""}</div>${evInline(r.shift_t, r.shift_quote)}</td>
      <td>${resPill(r.resolution)}</td>
      <td>${moodText(r.end_mood)}</td>
      <td>${r.intent_label}</td>
      <td><button class="action-btn" title="Open call">${ICONS.extLink}</button></td>`;
    tr.onclick=()=>openCall(r.sid);
    wireSeekChips(tr, r.sid);
    tbl.appendChild(tr);
  });
  card.appendChild(tbl); body.appendChild(card);
}

async function viewCustomers(){
  const m=freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Customers</h2>
    <div class="note">Monitoring active customer accounts and attention scores.</div></div>
    <button class="btn" id="exportBtn">${ICONS.upload}<span>Export</span></button>`));
  const [stats, cs] = await Promise.all([get("/api/stats"), get("/api/customers")]);
  state.cache.customers = cs; state.cache.stats = stats;
  m.appendChild(statCards([
    {label:"Total Customers Monitored", value: stats.total_customers},
    {label:"Critical Attention Needed", value: stats.critical_customers, tone:"warn"},
    {label:"Calls (latest day)", value: stats.calls_latest_day},
    {label:"System Status", value:"Operational", status:true},
  ]));
  const body=el("div"); m.appendChild(body);
  renderCustomersTable(body, cs, stats.latest_ms);
}
function renderCustomersTable(body, cs, latestMs){
  const q=($("#globalSearch").value||"").toLowerCase();
  const filtered = q ? cs.filter(c=>c.customer_name.toLowerCase().includes(q)) : cs;
  body.innerHTML="";
  if(!filtered.length){ body.appendChild(el("div","empty", cs.length?"No matches.":"No customers yet.")); return; }
  const card=el("div","table-card"); const tbl=el("table");
  tbl.innerHTML="<tr><th>Customer Name & ID</th><th>Total Calls</th><th>Worst Attention Score</th><th>Last Contact</th><th>Actions</th></tr>";
  filtered.forEach(c=>{
    const sev=sevOf(c.max_attention||0);
    const daysAgo = latestMs ? Math.max(0, Math.round((latestMs - c.last_ms)/86400000)) : null;
    const lastContact = daysAgo==null ? "—" : daysAgo===0 ? "Today" : daysAgo===1 ? "1 day ago" : `${daysAgo} days ago`;
    const tr=el("tr");
    tr.innerHTML=`<td><div class="name-cell">
        <div class="avatar ${avatarClass(c.customer_name)}">${initials(c.customer_name)}</div>
        <div class="meta"><span class="nm">${c.customer_name}</span><span class="id">ID: ${pseudoId("CUS",c.customer_name)}</span></div>
      </div></td>
      <td class="n">${c.n}</td>
      <td><div class="progress"><div class="track"><span class="sev-${sev}" style="width:${Math.min(100,c.max_attention||0)}%"></span></div>
          <span class="num">${c.max_attention||0}</span> ${`<span class="pill sev-${sev}">${sev==="crit"?"critical":sev==="hot"?"hot":sev==="warn"?"warn":"normal"}</span>`}</div></td>
      <td>${lastContact}</td>
      <td><button class="action-btn" title="View history">${ICONS.extLink}</button></td>`;
    tr.onclick=()=>{state.customer=c.customer_name;state.call=null;state.view="customer";route();closeOnMobile();};
    tbl.appendChild(tr);
  });
  card.appendChild(tbl); body.appendChild(card);
}

async function viewCustomer(){
  const m=freshMain();
  const back=el("button","back",`${ICONS.back}<span>All customers</span>`);
  back.onclick=()=>{state.customer=null;state.view="customers";route();};
  m.appendChild(back);
  m.appendChild(el("div","page-head",`<div><h2>${state.customer}</h2>
    <div class="note">Full call history</div></div>`));
  const body=el("div"); body.appendChild(el("div","spinner")); m.appendChild(body);

async function viewTrends(){
  const m=freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Conversation Trends</h2>
    <div class="note">Analyzing call volumes and resolutions across primary categories.</div></div>
    <button class="btn">${ICONS.upload}<span>Export</span></button>`));
  const body=el("div"); body.appendChild(el("div","spinner")); m.appendChild(body);
  const [cats, timeline] = await Promise.all([get("/api/trends"), get("/api/trends/timeline?days=7")]);
  body.innerHTML="";
  if(!cats.length){ body.appendChild(el("div","empty","No calls yet.")); return; }

  const top = cats[0];
  const overallRate = cats.reduce((a,c)=>a+c.resolved,0)/cats.reduce((a,c)=>a+c.n,0)*100;
  const topRate = 100*top.resolved/top.n;
  const delta = (topRate-overallRate).toFixed(0);
  const insight=el("div","insight");
  insight.innerHTML=`<div class="insight-icon">${ICONS.warnTri}</div>
    <div class="insight-body">
      <div class="insight-label">Top issue by volume</div>
      <div class="insight-title">${top.intent_cat.replace(/_/g," ")}
        <span class="insight-delta">${delta>=0?"+":""}${delta} pts resolution vs avg</span></div>
    </div>
    <button class="btn primary" id="investigateBtn">Investigate Calls ${ICONS.extLink}</button>`;
  body.appendChild(insight);
  insight.querySelector("#investigateBtn").onclick=()=>{
    $("#globalSearch").value = top.intent_cat.replace(/_/g," ");
    state.view="attention"; route();
  };

  const chartsRow=el("div","charts-row");
  const volCard=el("div","card");
  volCard.appendChild(el("h4",null,"Call Volume by Category"));
  volCard.appendChild(el("div",null, barChart(cats.slice(0,6).map(c=>({label:c.intent_cat.replace(/_/g," ").slice(0,10), n:c.n})))));
  const trendCard=el("div","card");
  trendCard.appendChild(el("h4",null,"Attention Score Trend"));
  trendCard.appendChild(el("div",null, lineChart(timeline)));
  if(timeline.length){
    const cur = timeline[timeline.length-1].avg_attention;
    const prev = timeline.length>1 ? timeline[timeline.length-2].avg_attention : cur;
    const d = (cur-prev).toFixed(1);
    const foot=el("div","chart-foot");
    foot.innerHTML=`<div><div class="note">Current avg</div><div class="big">${cur.toFixed(1)}</div></div>
      <div class="delta">${d>=0?"+":""}${d} vs prior day</div>`;
    trendCard.appendChild(foot);
  }
  chartsRow.appendChild(volCard); chartsRow.appendChild(trendCard);
  body.appendChild(chartsRow);

  const tilesWrap=el("div","card");
  tilesWrap.appendChild(el("h4",null,"Resolution Rate per Category"));
  const tiles=el("div","res-tiles");
  cats.slice(0,4).forEach(c=>{
    const pct = Math.round(100*c.resolved/c.n);
    const status = pct>=90?["Optimal","var(--warn-soft-fg)"]:pct>=75?["Stable","var(--muted)"]:["Warning","var(--crit-soft-fg)"];
    const tile=el("div","res-tile"); tile.style.background = pct>=90?"var(--warn-soft-bg)":pct>=75?"var(--panel-2)":"var(--crit-soft-bg)";
    tile.innerHTML=`<div class="cat">${c.intent_cat.replace(/_/g," ")}</div>
      <div class="pct">${pct}%</div><div class="status" style="color:${status[1]}">${status[0]}</div>`;
    tiles.appendChild(tile);
  });
  tilesWrap.appendChild(tiles); body.appendChild(tilesWrap);
}

async function viewAgents(){
  const m=freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Agent Performance</h2>
    <div class="note">Volume, handle time, resolution outcomes, and clarification signals per agent.</div></div>
    <button class="btn">${ICONS.upload}<span>Export</span></button>`));
  const [stats, agents] = await Promise.all([get("/api/stats"), get("/api/agents")]);
  state.cache.agents = agents;
  m.appendChild(statCards([
    {label:"Total Agents", value: stats.total_agents},
    {label:"High Risk", value: stats.high_risk_agents, tone:"warn"},
    {label:"Avg Handle Time", value: fmtT(stats.avg_handle_s)},
    {label:"System Status", value:"Operational", status:true},
  ]));
  const body=el("div"); m.appendChild(body);
  renderAgentsTable(body, agents);
}
function renderAgentsTable(body, agents){
  const q=($("#globalSearch").value||"").toLowerCase();
  const filtered = q ? agents.filter(a=>a.agent_name.toLowerCase().includes(q)) : agents;
  body.innerHTML="";
  if(!filtered.length){ body.appendChild(el("div","empty", agents.length?"No matches.":"No agents yet.")); return; }
  const card=el("div","table-card"); const tbl=el("table");
  tbl.innerHTML=`<tr><th>Agent Name & ID</th><th>Call Volume</th><th>Avg Handle Time</th><th>Resolution Rate</th>
    <th>Avg Attention Score</th><th>Clarification Signal <span title="How often the agent had to repeat or rephrase a question in the same call, relative to peers">${ICONS.info}</span></th></tr>`;
  filtered.forEach(a=>{
    const sev = sevOf(a.avg_attention||0);
    const okwarn = a.avg_attention>=50 ? '<span class="pill solid sev-hot">WARN</span>' : '<span class="pill sev-ok">OK</span>';
    const resPct = Math.round(100*a.resolved/a.calls);
    const clarSev = a.clarification_signal==="High" ? "hot" : "ok";
    const tr=el("tr");
    tr.innerHTML=`<td><div class="name-cell">
        <div class="avatar ${avatarClass(a.agent_name)}">${initials(a.agent_name)}</div>
        <div class="meta"><span class="nm">${a.agent_name}</span><span class="id">ID: ${pseudoId("AGT",a.agent_name)}</span></div>
      </div></td>
      <td class="n">${a.calls}</td>
      <td class="n">${fmtT(a.avg_handle_s)}</td>
      <td class="n">${resPct}%</td>
      <td><div class="progress"><div class="track"><span class="sev-${sev}" style="width:${Math.min(100,a.avg_attention||0)}%"></span></div>
          <span class="num">${Math.round(a.avg_attention)}</span></div> ${okwarn}</td>
      <td><span class="pill sev-${clarSev}">${a.clarification_signal}</span></td>`;
    tbl.appendChild(tr);
  });
  card.appendChild(tbl); body.appendChild(card);
}

/* ---------- bulk upload ---------- */
function viewUpload(){
  const m=freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Bulk Upload</h2>
    <div class="note">Ingest new recordings — transcribe, analyse, and store in one pass.</div></div>`));
  const card=el("div","card");
  const dz=el("div","dropzone");
  dz.innerHTML=`<div class="cloud">${ICONS.upload}</div>
    <div class="title">Drag and drop a .zip of recordings here</div>
    <div class="sub">containing audio/ and metadata/ folders — or click to browse</div>
    <button class="btn primary" type="button">Select File</button>`;
  dz.onclick=()=>$("#fileInput").click();
  ["dragover","dragenter"].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.add("drag");}));
  ["dragleave","dragend"].forEach(ev=>dz.addEventListener(ev, e=>{dz.classList.remove("drag");}));
  dz.addEventListener("drop", e=>{
    e.preventDefault(); dz.classList.remove("drag");
    const f = e.dataTransfer.files[0]; if(f) handleUploadFile(f);
  });
  card.appendChild(dz); m.appendChild(card);

  const qHead=el("div","queue-head");
  qHead.innerHTML=`<h4>Upload Queue</h4><span class="queue-count">${state.uploads.length} file${state.uploads.length===1?"":"s"}</span>`;
  m.appendChild(qHead);
  const list=el("div"); list.id="uploadList"; m.appendChild(list);
  renderUploadQueue(list);
}
function renderUploadQueue(list){
  list.innerHTML="";
  if(!state.uploads.length){ list.appendChild(el("div","empty","No uploads yet in this session.")); return; }
  [...state.uploads].reverse().forEach(u=>{
    const item=el("div","q-item");
    const top=el("div","q-item-top");
    const doneLabel = `${u.ingested.length} ingested`
      + ((u.skipped||[]).length ? ` · ${u.skipped.length} skipped` : "");
    const busyLabel = u.total ? `Processing ${u.processed||0} / ${u.total}…` : "Queued…";
    top.innerHTML=`<div class="qi-icon">${ICONS.file}</div><div class="qi-name">${u.name}</div>
      <div class="qi-status ${u.status==='processing'?'processing':u.status==='done'?'ok':'err'}">
        ${u.status==='processing'?busyLabel:u.status==='done'?doneLabel:'Failed'}</div>`;
    item.appendChild(top);
    if(u.status==="processing"){
      const bar=el("div","qi-bar");
      if(u.total){                       // real progress once the zip has been opened
        const pct=Math.round(100*(u.processed||0)/u.total);
        bar.innerHTML=`<span style="width:${pct}%;animation:none"></span>`;
      } else {
        bar.innerHTML=`<span></span>`;   // indeterminate while still queued
      }
      item.appendChild(bar);
    } else {
      const sub=el("div","q-sub");
      (u.ingested||[]).forEach(sid=>{
        const row=el("div","q-sub-row ok");
        row.innerHTML=`${ICONS.check}<a>${sid}</a> — ingested`;
        row.querySelector("a").onclick=()=>openCall(sid);
        sub.appendChild(row);
      });
      (u.failed||[]).forEach(f=>{
        const row=el("div","q-sub-row err");
        row.innerHTML=`${ICONS.alertCircle}<span>${f.sid}: ${f.error}</span>`;
        sub.appendChild(row);
      });
      if(u.error){
        const row=el("div","q-sub-row err"); row.innerHTML=`${ICONS.alertCircle}<span>${u.error}</span>`; sub.appendChild(row);
      }
      item.appendChild(sub);
    }
    list.appendChild(item);
  });
}
async function handleUploadFile(file){
  const entry = {id: state.uploads.length+1, name: file.name, status:"processing",
                 ingested:[], skipped:[], failed:[], processed:0, total:null};
  state.uploads.push(entry);
  const list=$("#uploadList"); if(list){ renderUploadQueue(list); const cnt=$(".queue-count"); if(cnt) cnt.textContent = state.uploads.length+" file"+(state.uploads.length===1?"":"s"); }
  const fd=new FormData(); fd.append("file", file);
  try{
    // The server queues the zip and returns a job id straight away -- transcription is
    // ~30s per call, far too slow to hold the request open. Poll for progress instead.
    const job = await fetch("/api/upload",{method:"POST",body:fd}).then(r=>r.json());
    if(!job.id) throw new Error(job.detail || "upload rejected");
    entry.jobId = job.id;
    while(true){
      await new Promise(r=>setTimeout(r, 1500));
      const s = await get(`/api/jobs/${job.id}`);
      Object.assign(entry, {processed:s.processed, total:s.total, ingested:s.ingested||[],
                            skipped:s.skipped||[], failed:s.failed||[], error:s.error});
      if($("#uploadList")) renderUploadQueue($("#uploadList"));
      if(s.status==="done" || s.status==="failed"){ entry.status = s.status==="done" ? "done" : "error"; break; }
    }
    const bits=[`${entry.ingested.length} ingested`];
    if(entry.skipped.length) bits.push(`${entry.skipped.length} already present (skipped)`);
    if(entry.failed.length)  bits.push(`${entry.failed.length} failed`);
    toast(bits.join(", ")+".", entry.failed.length||entry.error?"err":"ok");
  }catch(err){
    entry.status="error"; entry.error=String(err);
    toast("Upload failed: "+err, "err");
  }
  state.cache = {}; // invalidate so other views refetch fresh data
  if($("#uploadList")) renderUploadQueue($("#uploadList"));
}

/* ---------- per-call ---------- */
let audioEl=null, pendingSeek=null, hlTurnEl=null;
function seek(t){ if(audioEl&&t!=null){audioEl.currentTime=t;audioEl.play();highlightTurn(t,true);} }
function highlightTurn(t, forceScroll){
  const el=[...document.querySelectorAll(".turn")].reverse()
    .find(n=>parseFloat(n.dataset.t)<=t+0.01);
  if(!el || el===hlTurnEl){ return; }          // same turn still active -- don't fight manual scrolling
  if(hlTurnEl) hlTurnEl.classList.remove("hl");
  el.classList.add("hl");
  hlTurnEl = el;
  el.scrollIntoView({block:"center",behavior:"smooth"});
}

async function openCall(sid, seekTo){
  state.call=sid; state.view="call"; renderNav();
  hlTurnEl = null;
  const c=await get(`/api/calls/${sid}`); const a=c.analysis_json;
  const m=freshMain();
  const back=el("button","back",`${ICONS.back}<span>back</span>`); back.onclick=()=>{state.call=null;route();};
  m.appendChild(back);
  m.appendChild(el("div","page-head",`<div><h2>${c.customer_name}
    <span style="color:var(--dim);font-weight:400;font-size:16px">· Agent ${c.agent_name}</span></h2>
    <div class="note">${new Date(c.start_ms).toLocaleString()} · ${fmtT(c.duration_s)} · ${c.sid}</div></div>
    ${scoreBadge(c.attention)}`));

  const grid=el("div","grid2");
  const left=el("div"), right=el("div");

  const player=el("div","card");
  player.appendChild(el("h4",null,"Recording"));
  const au=el("audio"); au.controls=true; au.src=`/audio/${c.sid}.mp3`; au.preload="metadata";
  player.appendChild(au); audioEl=au;
  au.ontimeupdate=()=>highlightTurn(au.currentTime);
  if(seekTo!=null){ au.addEventListener("loadedmetadata", ()=>seek(seekTo), {once:true}); }
  left.appendChild(player);

  const sum=el("div","card");
  sum.appendChild(el("h4",null,"AI summary"));
  sum.appendChild(el("div","summary-text",c.summary||""));
  left.appendChild(sum);

  const tc=el("div","card");
  tc.appendChild(el("h4",null,"Transcript · click a timestamp to hear it"));
  (c.transcript||[]).forEach(t=>{
    const turn=el("div","turn"); turn.dataset.t=t.start;
    const ts=el("button","ts",fmtT(t.start)); ts.onclick=()=>seek(t.start);
    turn.appendChild(ts);
    const b=el("div","body");
    b.appendChild(el("div","spk "+t.speaker,t.speaker));
    b.appendChild(el("div",null,t.text));
    turn.appendChild(b); tc.appendChild(turn);
  });
  left.appendChild(tc);

  const evChip=(ev)=>{
    if(!ev){return el("div","note-line","No supporting evidence found.");}
    const d=el("div","ev");
    d.appendChild(el("div","q",`"${ev.quote}"`));
    d.appendChild(el("div","at",`▶ ${fmtT(ev.t)} — click to hear`));
    d.onclick=()=>seek(ev.t); return d;
  };

  const ic=el("div","card");
  ic.appendChild(el("h4",null,"Intent"));
  ic.appendChild(el("div","summary-text",a.intent.label));
  ic.appendChild(evChip(a.intent.evidence));
  right.appendChild(ic);

  const mc=el("div","card");
  mc.appendChild(el("h4",null,"Mood"));
  const mood=el("div","mood-row");
  mood.appendChild(el("span","mood-text m-"+a.mood.start_mood,a.mood.start_mood));
  const track=el("div","track-line");
  if(a.mood.shifted&&a.mood.shift){
    const pct=Math.min(90,Math.max(10,100*(a.mood.shift.t/(c.duration_s||1))));
    const mk=el("div","marker"); mk.style.left=pct+"%"; mk.onclick=()=>seek(a.mood.shift.t); track.appendChild(mk);
  }
  mood.appendChild(track);
  mood.appendChild(el("span","mood-text m-"+a.mood.end_mood,a.mood.end_mood));
  mc.appendChild(mood);
  if(a.mood.shifted&&a.mood.shift){
    mc.appendChild(el("div","note-line","<br>Shifted at "+fmtT(a.mood.shift.t)+":"));
    mc.appendChild(evChip(a.mood.shift));
  } else { mc.appendChild(el("div","note-line","<br>No clear mood shift.")); }
  right.appendChild(mc);

  const rc=el("div","card");
  rc.appendChild(el("h4",null,"Resolution"));
  const rp=el("div"); rp.innerHTML=resPill(a.resolution.status); rc.appendChild(rp);
  rc.appendChild(evChip(a.resolution.evidence));
  right.appendChild(rc);

  const ac=el("div","card");
  ac.appendChild(el("h4",null,`Attention score · ${c.attention}/100`));
  const ul=el("ul","reasons");
  (a.attention.reasons||[]).forEach(r=>{
    const li=el("li"); li.innerHTML=`<span>${r.factor.replace(/_/g," ")}</span><b>+${r.weight}</b>`;
    if(r.t!=null){li.style.cursor="pointer";li.onclick=()=>seek(r.t);}
    ul.appendChild(li);
  });
  ac.appendChild(ul); right.appendChild(ac);

  grid.appendChild(left); grid.appendChild(right); m.appendChild(grid);
}

/* ---------- routing ---------- */
function route(){
  renderNav(); setSearchPlaceholder();
  if(state.call) return;
  if(state.view==="customer")  return viewCustomer();
  if(state.view==="customers") return viewCustomers();
  if(state.view==="trends")    return viewTrends();
  if(state.view==="agents")    return viewAgents();
  if(state.view==="upload")    return viewUpload();
  return viewAttention();
}
$("#fileInput").addEventListener("change", e=>{
  const f=e.target.files[0]; if(f) handleUploadFile(f);
  e.target.value="";
});
$("#globalSearch").addEventListener("input", ()=>{
  const body = $("#main").querySelector(".table-card")?.parentElement;
  if(state.view==="attention" && state.cache.attention){ renderAttentionTable($("#main").children[1], state.cache.attention); }
  else if(state.view==="customers" && state.cache.customers){ renderCustomersTable($("#main").children[2], state.cache.customers, state.cache.stats?.latest_ms); }
  else if(state.view==="agents" && state.cache.agents){ renderAgentsTable($("#main").children[2], state.cache.agents); }
});
