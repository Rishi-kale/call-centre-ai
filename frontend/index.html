/* ---------- settings ---------- */
async function saveSettings(patch, onDone){
  try{
    const r = await fetch("/api/settings", {
      method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(patch)
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || "could not save");
    state.cache.settings = null;          // force a refetch so the view reflects the server
    toast("Saved.", "ok", 2200);
    if(onDone) onDone(d);
  }catch(e){ toast("Could not save: "+e.message, "err"); }
}

async function viewSettings(){
  const m = freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Settings</h2>
    <div class="note">Which models this system uses to transcribe and to analyse.</div></div>`));
  const body = el("div"); body.appendChild(el("div","spinner")); m.appendChild(body);

  let info;
  try {
    if(!state.cache.settings) state.cache.settings = await get("/api/settings");
    info = state.cache.settings;
  } catch(e){
    body.innerHTML=""; body.appendChild(el("div","empty","Could not load settings."));
    return;
  }
  body.innerHTML="";
  const cur = info.settings, w = info.whisper, hw = w.hardware || {}, rec = w.recommended || {};

  /* ================= transcription ================= */
  body.appendChild(el("div","sec-label","Transcription model (Whisper)"));
  const tc = el("div","card set-card");

  // hardware strip: pipe-separated facts, monospace, in its own bordered band
  const facts = [hw.cuda_devices
    ? `<b>GPU</b><span>${esc(hw.gpus?.[0]?.name || "CUDA device")}</span>`
    : `<b>CPU only</b><span>no CUDA GPU detected</span>`];
  if(hw.cuda_devices && hw.vram_gb) facts.push(`<span>${hw.vram_gb} GB VRAM</span>`);
  if(hw.cpu_cores) facts.push(`<span>${hw.cpu_cores} cores</span>`);
  if(hw.ram_total_gb) facts.push(
    `<span>${hw.ram_total_gb} GB RAM${hw.ram_available_gb!=null?` (${hw.ram_available_gb} free)`:""}</span>`);
  tc.appendChild(el("div","hw-strip", facts.join('<i class="hw-sep"></i>')));

  const recBox = el("div","rec-strip");
  recBox.innerHTML = `${ICONS.info}<span class="rec-tag">Recommended</span>
    <span class="rec-body"><b>${esc((w.catalogue.find(x=>x.id===rec.model)||{}).label || rec.model || "")}:</b>
    ${esc(rec.reason||"")}</span>`;
  tc.appendChild(recBox);

  if((rec.warnings||[]).length){
    const warn = el("div","warn-strip");
    (rec.warnings||[]).forEach(msg=>{
      const row = el("div","warn-row");
      row.innerHTML = `${ICONS.warnTri}<span>${esc(msg)}</span>`;
      warn.appendChild(row);
    });
    tc.appendChild(warn);
  }

  const wlist = el("div","opt-list");
  w.catalogue.forEach(mm=>{
    const on = mm.id === cur.whisper_model;
    const row = el("label","opt"+(on?" on":""));
    const radio = el("input"); radio.type="radio"; radio.name="whispermodel"; radio.checked=on;
    radio.onchange = ()=> saveSettings({whisper_model: mm.id}, ()=>route());
    row.appendChild(radio);
    const mid = el("div","opt-mid");
    mid.innerHTML = `<div class="opt-title">${esc(mm.label)}
        <span class="opt-sub">${esc(mm.params)}</span>
        ${mm.id===rec.model?'<span class="tagpill rec">recommended</span>':""}
        ${on?'<span class="tagpill use">in use</span>':""}</div>
      <div class="opt-note">${esc(mm.note)}</div>`;
    row.appendChild(mid);
    row.appendChild(el("div","opt-right",
      `<div>${esc(mm.speed)}</div><div class="opt-mono">~${mm.ram_gb} GB</div>`));
    wlist.appendChild(row);
  });
  tc.appendChild(wlist);
  if((w.loaded||[]).length){
    tc.appendChild(el("div","loaded-line",
      "Loaded in memory: " + w.loaded.map(l=>`${esc(l.model)} (${esc(l.device)}/${esc(l.compute_type)})`).join(", ")));
  }
  body.appendChild(tc);

  /* ================= analysis ================= */
  body.appendChild(el("div","sec-label","Analysis model (LLM)"));
  const ac = el("div","card set-card");
  const eff = info.effective_llm || {};
  ac.appendChild(el("div","inuse-strip",
    `<span class="rec-tag">In use</span><b>${esc(eff.backend||"")}</b>` +
    (eff.model ? `<span class="opt-mono">${esc(eff.model)}</span>`
               : `<span class="rec-body">Deterministic keyword rules — no API key needed.</span>`)));

  const autoOn = cur.llm_backend === "auto";
  const autoRow = el("label","opt auto"+(autoOn?" on":""));
  const autoRadio = el("input"); autoRadio.type="radio"; autoRadio.name="llmbackend";
  autoRadio.checked = autoOn;
  autoRadio.onchange = ()=> saveSettings({llm_backend:"auto", llm_model:null}, ()=>route());
  autoRow.appendChild(autoRadio);
  autoRow.appendChild(el("div","opt-mid",
    `<div class="opt-title">Automatic</div>
     <div class="opt-note">Use the first provider that has an API key, and fall back to the
      heuristic if none do. Currently resolves to <b>${esc(eff.backend||"")}</b>.</div>`));
  ac.appendChild(autoRow);

  info.providers.forEach(p=>{
    const grp = el("div","prov-grp"+(p.available?"":" off"));
    const head = el("div","prov-head");
    head.innerHTML = `<span class="prov-name">${esc(p.label)}</span>` +
      (p.available ? `<span class="tagpill key">${ICONS.check2} key configured</span>`
                   : `<span class="tagpill nokey">no key</span>`);
    grp.appendChild(head);
    if(!p.available && p.env){
      grp.appendChild(el("div","prov-hint",
        `Set <code>${esc(p.env)}</code> in <code>.env</code>${p.signup?` — get one at ${esc(p.signup)}`:""}`));
    }
    p.models.forEach(mm=>{
      const on = cur.llm_backend===p.id &&
                 (cur.llm_model===mm.id || (!cur.llm_model && eff.model===mm.id));
      const row = el("label","opt"+(on?" on":"")+(p.available?"":" disabled"));
      const radio = el("input"); radio.type="radio"; radio.name="llmbackend";
      radio.checked = on; radio.disabled = !p.available;
      radio.onchange = ()=> saveSettings({llm_backend:p.id, llm_model:mm.id}, ()=>route());
      row.appendChild(radio);
      row.appendChild(el("div","opt-mid",
        `<div class="opt-title">${esc(mm.label)}</div>
         <div class="opt-note">${esc(mm.note)}</div>`));
      row.appendChild(el("div","opt-right",`<div class="opt-mono">${esc(mm.id)}</div>`));
      grp.appendChild(row);
    });
    ac.appendChild(grp);
  });
  body.appendChild(ac);
}

/* ---------- bulk upload ---------- */
function viewUpload(){
  const m=freshMain();
  m.appendChild(el("div","page-head",`<div><h2>Bulk Upload</h2>
    <div class="note">Ingest new recordings — transcribe, analyse, and store in one pass.</div></div>`));
  const card=el("div","card");
  const dz=el("div","dropzone");
  dz.innerHTML=`<div class="cloud">${ICONS.upload}</div>
    <div class="title">Drag and drop a .zip of recordings here</div>
    <div class="sub">containing audio/ and metadata/ folders — or click to browse</div>
    <button class="btn primary" type="button">Select File</button>`;
  dz.onclick=()=>$("#fileInput").click();
  ["dragover","dragenter"].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.add("drag");}));
  ["dragleave","dragend"].forEach(ev=>dz.addEventListener(ev, e=>{dz.classList.remove("drag");}));
  dz.addEventListener("drop", e=>{
    e.preventDefault(); dz.classList.remove("drag");
    const f = e.dataTransfer.files[0]; if(f) handleUploadFile(f);
  });
  card.appendChild(dz); m.appendChild(card);
  const modelSlot=el("div","upload-model"); m.appendChild(modelSlot);
  get("/api/settings").then(info=>{
    const wm = info.settings.whisper_model, eff = info.effective_llm || {};
    const label = (info.whisper.catalogue.find(x=>x.id===wm)||{}).label || wm;
    modelSlot.innerHTML = `Transcribing with <b>${esc(label)}</b>, analysing with
      <b>${esc(eff.backend||"")}</b>${eff.model?` (${esc(eff.model)})`:""}.`;
    const link=el("button","link-btn","Change in Settings");
    link.onclick=()=>{ state.view="settings"; route(); };
    modelSlot.appendChild(link);
  }).catch(()=>{});

  const qHead=el("div","queue-head");
  qHead.innerHTML=`<h4>Upload Queue</h4>`;
  const right=el("div","queue-head-right");
  const clearDone=el("button","filter-clear","Clear finished");
  clearDone.onclick=()=>{
    state.uploads = state.uploads.filter(u => u.status === "processing");
    renderUploadQueue($("#uploadList"));
  };
  right.appendChild(clearDone);
  right.appendChild(el("span","queue-count",
    `${state.uploads.length} file${state.uploads.length===1?"":"s"}`));
  qHead.appendChild(right);
  m.appendChild(qHead);
  const list=el("div"); list.id="uploadList"; m.appendChild(list);
  renderUploadQueue(list);
}
/** Drop one finished entry from the queue. In-flight uploads are not clearable: the
 *  server keeps processing regardless, so removing the row would just hide work that is
 *  still happening. */
function clearUpload(entry){
  state.uploads = state.uploads.filter(u => u !== entry);
  const list = $("#uploadList");
  if(list) renderUploadQueue(list);
}
function syncQueueCount(){
  const cnt = $(".queue-count");
  if(cnt) cnt.textContent = `${state.uploads.length} file${state.uploads.length===1?"":"s"}`;
}
function renderUploadQueue(list){
  list.innerHTML="";
  syncQueueCount();
  if(!state.uploads.length){ list.appendChild(el("div","empty","No uploads yet in this session.")); return; }
  [...state.uploads].reverse().forEach(u=>{
    const item=el("div","q-item");
    const top=el("div","q-item-top");
    const doneLabel = `${u.ingested.length} ingested`
      + ((u.skipped||[]).length ? ` · ${u.skipped.length} skipped` : "");
    const busyLabel = u.total ? `Processing ${u.processed||0} / ${u.total}…` : "Queued…";
    top.innerHTML=`<div class="qi-icon">${ICONS.file}</div>
      <div class="qi-name">${u.name}</div>
      <div class="qi-status ${u.status==='processing'?'processing':u.status==='done'?'ok':'err'}">
        ${u.status==='processing'?busyLabel:u.status==='done'?doneLabel:'Failed'}</div>`;
    if(u.status!=="processing"){
      const x=el("button","qi-clear",ICONS.x);
      x.title="Clear from queue"; x.setAttribute("aria-label",`Clear ${u.name} from queue`);
      x.onclick=(e)=>{ e.stopPropagation(); clearUpload(u); };
      top.appendChild(x);
    }
    item.appendChild(top);
    if(u.status==="processing"){
      const bar=el("div","qi-bar");
      if(u.total){                       // real progress once the zip has been opened
        const pct=Math.round(100*(u.processed||0)/u.total);
        bar.innerHTML=`<span style="width:${pct}%;animation:none"></span>`;
      } else {
        bar.innerHTML=`<span></span>`;   // indeterminate while still queued
      }
      item.appendChild(bar);
    } else {
      const sub=el("div","q-sub");
      (u.ingested||[]).forEach(sid=>{
        const row=el("div","q-sub-row ok");
        row.innerHTML=`${ICONS.check}<a>${sid}</a> — ingested`;
        row.querySelector("a").onclick=()=>openCall(sid);
        sub.appendChild(row);
      });
      (u.failed||[]).forEach(f=>{
        const row=el("div","q-sub-row err");
        row.innerHTML=`${ICONS.alertCircle}<span>${f.sid}: ${f.error}</span>`;
        sub.appendChild(row);
      });
      if(u.error){
        const row=el("div","q-sub-row err"); row.innerHTML=`${ICONS.alertCircle}<span>${u.error}</span>`; sub.appendChild(row);
      }
      item.appendChild(sub);
    }
    list.appendChild(item);
  });
}
async function handleUploadFile(file){
  const entry = {id: state.uploads.length+1, name: file.name, status:"processing",
                 ingested:[], skipped:[], failed:[], processed:0, total:null};
  state.uploads.push(entry);
  const list=$("#uploadList"); if(list){ renderUploadQueue(list); const cnt=$(".queue-count"); if(cnt) cnt.textContent = state.uploads.length+" file"+(state.uploads.length===1?"":"s"); }
  const fd=new FormData(); fd.append("file", file);
  try{
    // The server queues the zip and returns a job id straight away -- transcription is
    // ~30s per call, far too slow to hold the request open. Poll for progress instead.
    // no ?model= from the UI: the Settings tab is the single source of truth, and the
    // server reads it per call. The query param stays available for scripted overrides.
    const job = await fetch("/api/upload",{method:"POST",body:fd}).then(r=>r.json());
    if(!job.id) throw new Error(job.detail || "upload rejected");
    entry.jobId = job.id;
    while(true){
      await new Promise(r=>setTimeout(r, 1500));
      const s = await get(`/api/jobs/${job.id}`);
      Object.assign(entry, {processed:s.processed, total:s.total, ingested:s.ingested||[],
                            skipped:s.skipped||[], failed:s.failed||[], error:s.error});
      if($("#uploadList")) renderUploadQueue($("#uploadList"));
      if(s.status==="done" || s.status==="failed"){ entry.status = s.status==="done" ? "done" : "error"; break; }
    }
    const bits=[`${entry.ingested.length} ingested`];
    if(entry.skipped.length) bits.push(`${entry.skipped.length} already present (skipped)`);
    if(entry.failed.length)  bits.push(`${entry.failed.length} failed`);
    toast(bits.join(", ")+".", entry.failed.length||entry.error?"err":"ok");
  }catch(err){
    entry.status="error"; entry.error=String(err);
    toast("Upload failed: "+err, "err");
  }
  state.cache = {}; // invalidate so other views refetch fresh data
  if($("#uploadList")) renderUploadQueue($("#uploadList"));
}

/* ---------- per-call ---------- */
let audioEl=null, pendingSeek=null, hlTurnEl=null;
function seek(t){ if(audioEl&&t!=null){audioEl.currentTime=t;audioEl.play();highlightTurn(t,true);} }
function highlightTurn(t, forceScroll){
  const el=[...document.querySelectorAll(".turn")].reverse()
    .find(n=>parseFloat(n.dataset.t)<=t+0.01);
  if(!el || el===hlTurnEl){ return; }          // same turn still active -- don't fight manual scrolling
  if(hlTurnEl) hlTurnEl.classList.remove("hl");
  el.classList.add("hl");
  hlTurnEl = el;
  el.scrollIntoView({block:"center",behavior:"smooth"});
}

async function openCall(sid, seekTo){
  state.call=sid; state.view="call"; renderNav();
  hlTurnEl = null;
  const c=await get(`/api/calls/${sid}`); const a=c.analysis_json;
  const m=freshMain();
  const back=el("button","back",`${ICONS.back}<span>back</span>`); back.onclick=()=>{state.call=null;route();};
  m.appendChild(back);
  m.appendChild(el("div","page-head",`<div><h2>${c.customer_name}
    <span style="color:var(--dim);font-weight:400;font-size:16px">· Agent ${c.agent_name}</span></h2>
    <div class="note">${new Date(c.start_ms).toLocaleString()} · ${fmtT(c.duration_s)} · ${c.sid}</div></div>
    ${scoreBadge(c.attention)}`));

  const grid=el("div","grid2");
  const left=el("div"), right=el("div");

  const player=el("div","card");
  player.appendChild(el("h4",null,"Recording"));
  const au=el("audio"); au.controls=true; au.src=`/audio/${c.sid}.mp3`; au.preload="metadata";
  player.appendChild(au); audioEl=au;
  au.ontimeupdate=()=>highlightTurn(au.currentTime);
  if(seekTo!=null){ au.addEventListener("loadedmetadata", ()=>seek(seekTo), {once:true}); }
  left.appendChild(player);

  const sum=el("div","card");
  sum.appendChild(el("h4",null,"AI summary"));
  sum.appendChild(el("div","summary-text",c.summary||""));
  left.appendChild(sum);

  const tc=el("div","card");
  tc.appendChild(el("h4",null,"Transcript · click a timestamp to hear it"));
  (c.transcript||[]).forEach(t=>{
    const turn=el("div","turn"); turn.dataset.t=t.start;
    const ts=el("button","ts",fmtT(t.start)); ts.onclick=()=>seek(t.start);
    turn.appendChild(ts);
    const b=el("div","body");
    b.appendChild(el("div","spk "+t.speaker,t.speaker));
    b.appendChild(el("div",null,t.text));
    turn.appendChild(b); tc.appendChild(turn);
  });
  left.appendChild(tc);

  const evChip=(ev)=>{
    if(!ev){return el("div","note-line","No supporting evidence found.");}
    const d=el("div","ev");
    d.appendChild(el("div","q",`"${ev.quote}"`));
    d.appendChild(el("div","at",`▶ ${fmtT(ev.t)} — click to hear`));
    d.onclick=()=>seek(ev.t); return d;
  };

  const ic=el("div","card");
  ic.appendChild(el("h4",null,"Intent"));
  ic.appendChild(el("div","summary-text",a.intent.label));
  ic.appendChild(evChip(a.intent.evidence));
  right.appendChild(ic);

  const mc=el("div","card");
  mc.appendChild(el("h4",null,"Mood"));
  const mood=el("div","mood-row");
  mood.appendChild(el("span","mood-text m-"+a.mood.start_mood,a.mood.start_mood));
  const track=el("div","track-line");
  if(a.mood.shifted&&a.mood.shift){
    const pct=Math.min(90,Math.max(10,100*(a.mood.shift.t/(c.duration_s||1))));
    const mk=el("div","marker"); mk.style.left=pct+"%"; mk.onclick=()=>seek(a.mood.shift.t); track.appendChild(mk);
  }
  mood.appendChild(track);
  mood.appendChild(el("span","mood-text m-"+a.mood.end_mood,a.mood.end_mood));
  mc.appendChild(mood);
  if(a.mood.shifted&&a.mood.shift){
    mc.appendChild(el("div","note-line","<br>Shifted at "+fmtT(a.mood.shift.t)+":"));
    mc.appendChild(evChip(a.mood.shift));
  } else { mc.appendChild(el("div","note-line","<br>No clear mood shift.")); }
  right.appendChild(mc);

  const rc=el("div","card");
  rc.appendChild(el("h4",null,"Resolution"));
  const rp=el("div"); rp.innerHTML=resPill(a.resolution.status); rc.appendChild(rp);
  rc.appendChild(evChip(a.resolution.evidence));
  right.appendChild(rc);

  const ac=el("div","card");
  ac.appendChild(el("h4",null,`Attention score · ${c.attention}/100`));
  const ul=el("ul","reasons");
  (a.attention.reasons||[]).forEach(r=>{
    const li=el("li"); li.innerHTML=`<span>${r.factor.replace(/_/g," ")}</span><b>+${r.weight}</b>`;
    if(r.t!=null){li.style.cursor="pointer";li.onclick=()=>seek(r.t);}
    ul.appendChild(li);
  });
  ac.appendChild(ul); right.appendChild(ac);

  grid.appendChild(left); grid.appendChild(right); m.appendChild(grid);

  // ---- sibling-call widgets: where does a manager go from here? ----
  const ctxWrap = el("div","ctx-grid"); m.appendChild(ctxWrap);
  renderCallContext(ctxWrap, sid, c);
}

/* ---------- sibling-call widgets on the call detail view ---------- */
function ctxRow(r, opts={}){
  const row=el("div","ctx-row");
  row.appendChild(el("div","score sev-"+sevOf(r.attention), String(r.attention)));
  const mid=el("div","ctx-mid");
  const head = opts.showCustomer ? r.customer_name : new Date(r.start_ms).toLocaleDateString();
  mid.appendChild(el("div","ctx-head",
    `${head} <span class="ctx-dim">· ${opts.showCustomer ? "Agent "+r.agent_name : r.intent_label}</span>`));
  mid.appendChild(el("div","ctx-sum", r.summary||""));
  const tags=el("div","ctx-tags");
  tags.innerHTML = resPill(r.resolution) + `<span class="tag">${moodText(r.end_mood)}</span>`;
  mid.appendChild(tags);
  row.appendChild(mid);
  row.onclick=()=>{ openCall(r.sid); window.scrollTo({top:0,behavior:"smooth"}); };
  return row;
}

async function renderCallContext(wrap, sid, call){
  wrap.innerHTML = `<div class="card"><div class="spinner"></div></div>
                    <div class="card"><div class="spinner"></div></div>`;
  let ctx;
  try { ctx = await get(`/api/calls/${sid}/context`); }
  catch(e){ wrap.innerHTML=""; return; }
  wrap.innerHTML="";

  /* --- widget 1: this customer's other calls --- */
  const a=el("div","card");
  a.appendChild(el("h4",null,`${ctx.customer_name} · other calls`));
  if(ctx.same_issue_repeats > 0){
    const flag=el("div","ctx-flag");
    flag.innerHTML=`${ICONS.warnTri}<span><b>Called about this issue ${ctx.same_issue_repeats}
      other time${ctx.same_issue_repeats===1?"":"s"}.</b> A repeat on the same issue is worth
      checking — an earlier call marked resolved may not have been.</span>`;
    a.appendChild(flag);
  }
  if(!ctx.customer_calls.length){
    a.appendChild(el("div","ctx-empty","No other calls from this customer."));
  } else {
    const list=el("div","ctx-list");
    ctx.customer_calls.forEach(r=>list.appendChild(ctxRow(r)));
    a.appendChild(list);
  }
  wrap.appendChild(a);

  /* --- widget 2: everyone else with the same issue --- */
  const b=el("div","card");
  const st=ctx.intent_stats||{};
  const pct = st.n ? Math.round(100*st.resolved/st.n) : 0;
  // Title the CATEGORY, not this call's intent_label -- the list is grouped by
  // intent_cat, and the free-text label ("reset_password") would misdescribe it.
  b.appendChild(el("h4",null,`Others with: ${(ctx.intent_cat||"").replace(/_/g," ")}`));
  const bar=el("div","ctx-stats");
  bar.innerHTML=`<span><b>${st.n||0}</b> calls</span>
    <span><b>${st.customers||0}</b> customers</span>
    <span><b>${pct}%</b> resolved</span>
    <span>avg score <b>${Math.round(st.avg_attention||0)}</b></span>`;
  b.appendChild(bar);
  b.appendChild(el("div","ctx-note",
    pct >= 80
      ? `Most of these get resolved — the ${100-pct}% that don't are the ones worth a shared fix.`
      : `Only ${pct}% of these get resolved. That points at a process gap, not a one-off call.`));
  if(!ctx.same_intent.length){
    b.appendChild(el("div","ctx-empty","No other customers with this intent."));
  } else {
    const list=el("div","ctx-list");
    ctx.same_intent.forEach(r=>list.appendChild(ctxRow(r,{showCustomer:true})));
    b.appendChild(list);
  }
  wrap.appendChild(b);
}

/* ---------- routing ---------- */
function route(){
  renderNav(); setSearchPlaceholder();
  if(state.call) return;
  if(state.view==="customer")  return viewCustomer();
  if(state.view==="customers") return viewCustomers();
  if(state.view==="trends")    return viewTrends();
  if(state.view==="agents")    return viewAgents();
  if(state.view==="upload")    return viewUpload();
  if(state.view==="settings")  return viewSettings();
  return viewAttention();
}
$("#fileInput").addEventListener("change", e=>{
  const f=e.target.files[0]; if(f) handleUploadFile(f);
  e.target.value="";
});
// Search is server-side now (a paged view can only filter what the server sends), so it
// refetches -- debounced to avoid a request per keystroke -- and resets to the first page.
let searchTimer=null;
$("#globalSearch").addEventListener("input", ()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    if(!["attention","customers","agents"].includes(state.view)) return;
    pageState[state.view]=0;
    // reload just the table -- the stat cards and chrome are unaffected by a search
    (state.reloadPage || route)();
  }, 300);
});

/* ---------- chrome init ---------- */
$("#railToggle").innerHTML = ICONS.menu;
$("#searchIcon").innerHTML = ICONS.search;
$("#filterBtn").innerHTML = ICONS.filter;
// the topbar filter icon was decorative -- point it at the panel that actually exists
$("#filterBtn").onclick = (e)=>{
  e.stopPropagation();
  const b = $("#intentFilterBtn");
  if(b) b.click();
  else toast("Filters are available on the Needs Attention tab.", "ok", 3200);
};
$("#chevIcon").innerHTML = ICONS.chev;
applyTheme(document.documentElement.getAttribute("data-theme")||"light");
setCollapsed(getCollapsed());
$("#railToggle").onclick=()=>setCollapsed(!$("#app").classList.contains("collapsed"));
$("#scrim").onclick=()=>setCollapsed(true);
$("#themeToggle").onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
$("#pdTheme").onclick=()=>{ $("#themeToggle").click(); };
$("#profileTrigger").onclick=(e)=>{ e.stopPropagation(); $("#profileDropdown").classList.toggle("open"); };
document.addEventListener("click", ()=>$("#profileDropdown").classList.remove("open"));
document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#globalSearch").focus(); }
  else if(e.key==="Escape"){ document.activeElement && document.activeElement.blur(); $("#profileDropdown").classList.remove("open"); closeOnMobile(); }
});

route();
</script>
